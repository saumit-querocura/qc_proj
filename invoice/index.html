<style>
  [hidden] { display: none !important; }
  .shell { max-width: 640px; }
  .iv { border-radius: 24px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 30px 60px -40px rgba(16,14,42,.45); overflow: hidden; }
  .iv-top { padding: 20px 20px 16px; border-top: 5px solid var(--iv, #0e8f83); display: flex; gap: 14px; align-items: flex-start; }
  .iv-top img { max-height: 48px; max-width: 120px; object-fit: contain; border-radius: 6px; background: #fff; }
  .iv-top h1 { font-size: 19px; margin: 0 0 2px; } .iv-sub { color: var(--muted); font-size: 13px; margin: 0; }
  .iv-title { padding: 0 20px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .iv-title b { font: 800 13px 'Space Grotesk', sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--iv, #0e8f83); }
  .iv-title span { font-size: 13px; color: var(--muted); }
  .iv-amt { margin: 14px 20px; padding: 16px; border-radius: 16px; background: rgba(14,143,131,.08); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .iv-amt.due { background: rgba(210,79,40,.09); } .iv-amt small { display: block; font-weight: 700; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .iv-amt strong { font: 800 28px 'Space Grotesk', sans-serif; }
  .iv-sec { padding: 4px 20px 14px; } .iv-h { font: 800 11.5px 'Manrope', sans-serif; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 12px 0 6px; }
  .iv-kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 14px; font-variant-numeric: tabular-nums; } .iv-kv b { text-align: right; }
  .iv-kv .tot { font-weight: 800; border-top: 1.5px solid var(--line); padding-top: 6px; }
  details.iv-lines summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
  .iv-line { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; padding: 6px 0; border-bottom: 1px dashed var(--line); } .iv-line span small { display: block; color: var(--muted); font-size: 12px; }
  .iv-acts { display: grid; gap: 10px; padding: 6px 20px 20px; }
  .iv-btn { display: block; text-align: center; padding: 15px; border-radius: 14px; font: 800 16px 'Space Grotesk', sans-serif; text-decoration: none; border: 1.5px solid var(--line); color: inherit; }
  .iv-btn.pay { color: #fff; border: 0; background: linear-gradient(135deg, #0e8f83, #2f8fd1); }
  .iv-qr { display: flex; gap: 14px; align-items: center; padding: 0 20px 14px; } .iv-qr svg { width: 120px; height: 120px; background: #fff; border-radius: 10px; padding: 4px; flex: 0 0 auto; }
  .iv-qr p { margin: 0; font-size: 13px; color: var(--muted); }
  .iv-ok { margin: 14px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; }
  .iv-ok b { color: #0e8f83; }
  @media (hover: none) { .iv-qr { display: none; } }
</style>
