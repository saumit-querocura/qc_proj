<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — QueroCura</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="../icons/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Apply saved theme before paint to avoid a light-mode flash, same
  // 'qc-theme' key the main site's toggle uses so the choice carries over.
  (function () {
    try {
      if (localStorage.getItem('qc-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    font-family: 'Manrope', sans-serif; background: #f6f5f1; color: #100e2a;
  }
  h1 { font-family: 'Space Grotesk', sans-serif; }
  a { color: #0e8f83; text-decoration: none; }
  a:hover { color: #0b6f66; }

  /* ---- Topbar (ditto index.html nav) ---- */
  .topbar {
    width: 100%; box-sizing: border-box; padding: 16px clamp(16px,4vw,48px);
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(246,245,241,0.85); backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 30; border-bottom: 1px solid rgba(16,14,42,0.08);
  }
  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-wrap img { width: 42px; height: 39px; object-fit: contain; }
  .logo-text { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; font-family: 'Space Grotesk', sans-serif; }
  .logo-text .ink { color: #100e2a; }
  .logo-text .teal { color: #0e8f83; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .navlink { color: #100e2a; font-size: 14.5px; font-weight: 600; position: relative; transition: color 0.2s ease; }
  .navlink:hover { color: #0e8f83 !important; }
  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px;
    border-radius: 10px; border: 1.5px solid rgba(16,14,42,0.14); background: #fff; cursor: pointer;
    padding: 0; transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease; flex: 0 0 auto;
  }
  .theme-toggle:hover { transform: translateY(-2px); }

  .wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card {
    width: 100%; max-width: 420px; background: #fff; border-radius: 24px;
    padding: 40px 36px; border: 1px solid rgba(16,14,42,0.08);
    box-shadow: 0 20px 60px rgba(16,14,42,0.10);
  }
  .card h1 { font-size: 26px; margin: 0 0 6px; }
  .card p.sub { margin: 0 0 28px; color: rgba(16,14,42,0.6); font-size: 14.5px; }

  /* ---- Floating-label fields (same radius/border as the site's .wl-input) ---- */
  .field { margin-bottom: 20px; }
  .field-inner { position: relative; }
  .field-input {
    width: 100%; padding: 20px 44px 8px 16px; border-radius: 12px;
    border: 1.5px solid rgba(16,14,42,0.14); font-family: 'Manrope', sans-serif;
    font-size: 15px; color: #100e2a; background: #fff; outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .field-input:focus { border-color: #0e8f83; box-shadow: 0 0 0 3px rgba(14,143,131,0.15); }
  .field-label {
    position: absolute; left: 16px; top: 18px; font-size: 15px; color: rgba(16,14,42,0.45);
    pointer-events: none; transition: all 0.15s ease; background: transparent;
  }
  .field-input:focus ~ .field-label, .field-input.filled ~ .field-label {
    top: 8px; font-size: 11px; font-weight: 700; color: #0e8f83;
  }
  .field-eye {
    position: absolute; right: 12px; top: 14px; background: none; border: none;
    cursor: pointer; font-size: 17px; opacity: 0.55; padding: 4px;
  }
  .field-eye:hover { opacity: 0.9; }

  /* ---- Submit button (ditto index.html .cta shine-sweep) ---- */
  .submit {
    position: relative; overflow: hidden;
    width: 100%; background: #0e8f83; color: #fff; font-size: 16px; font-weight: 700;
    padding: 14px 30px; border-radius: 999px; border: none; cursor: pointer;
    font-family: 'Manrope', sans-serif; margin-top: 6px;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .submit::after {
    content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg); transition: left 0.6s ease; pointer-events: none;
  }
  .submit:hover:not(:disabled)::after { left: 140%; }
  .submit:hover:not(:disabled) { background: #0b6f66; transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(14,143,131,0.45); }
  .submit:disabled { opacity: 0.65; cursor: default; }
  .submit .arrow { transition: transform 0.15s ease; }
  .submit:hover:not(:disabled) .arrow { transform: translateX(3px); }

  .alt { text-align: center; margin-top: 22px; font-size: 14px; color: rgba(16,14,42,0.7); }
  .alt a { font-weight: 700; }
  .error {
    display: none; background: #fdece7; color: #b3401f; border-radius: 12px;
    padding: 12px 14px; font-size: 13.5px; margin-bottom: 18px; font-weight: 600;
  }

  /* ---- Dark mode (same palette/keys as index.html) ---- */
  html[data-theme="dark"] body { background: #0d0c1f; color: #f2f0f8; }
  html[data-theme="dark"] a { color: #7ee0d4; }
  html[data-theme="dark"] a:hover { color: #9beee0; }
  html[data-theme="dark"] .topbar { background: rgba(13,12,31,0.85); border-bottom-color: rgba(255,255,255,0.1); }
  html[data-theme="dark"] .logo-text .ink { color: #f2f0f8; }
  html[data-theme="dark"] .navlink { color: #f2f0f8; }
  html[data-theme="dark"] .theme-toggle { background: #18162e; border-color: rgba(255,255,255,0.14); }
  html[data-theme="dark"] .card { background: #18162e; border-color: rgba(255,255,255,0.1); }
  html[data-theme="dark"] .card p.sub { color: #a9a6bd; }
  html[data-theme="dark"] .field-input { background: #100e2a; color: #f2f0f8; border-color: rgba(255,255,255,0.14); }
  html[data-theme="dark"] .field-label { color: #8f8ba3; }
  html[data-theme="dark"] .alt { color: #a9a6bd; }
  html[data-theme="dark"] .error { background: rgba(210,79,40,0.16); color: #f0a488; }
</style>
</head>
<body>
  <div class="topbar">
    <a class="logo-wrap" href="../">
      <img src="../assets/d4f7acc01b9438e998c9e7b9676584b0.png" alt="QueroCura">
      <span class="logo-text"><span class="ink">Quero</span><span class="teal">Cura</span></span>
    </a>
    <div class="topbar-right">
      <a class="navlink" href="../">Back to home</a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" id="theme-toggle-btn">
        <span id="theme-toggle-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke="#100e2a" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
      </button>
    </div>
  </div>
  <div class="wrap">
    <div class="card">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to pick up where you left off.</p>
      <div class="error" id="qc-error"></div>
      <form id="qc-login-form">
        <div class="field">
          <div class="field-inner">
            <input type="email" class="field-input" id="qc-email" name="email" autocomplete="email" placeholder=" " required oninput="this.classList.toggle('filled', this.value.length>0)">
            <label class="field-label" for="qc-email">Email</label>
          </div>
        </div>
        <div class="field">
          <div class="field-inner">
            <input type="password" class="field-input" id="qc-password" name="password" autocomplete="current-password" placeholder=" " required
              oninput="this.classList.toggle('filled', this.value.length>0)">
            <button type="button" class="field-eye" tabindex="-1" onclick="qcToggleEye(this)">&#128065;</button>
            <label class="field-label" for="qc-password">Password</label>
          </div>
        </div>
        <button type="submit" class="submit" id="qc-submit-btn">
          <span class="btn-label">Sign in</span><span class="arrow">&rarr;</span>
        </button>
      </form>
      <div class="alt">New to QueroCura? <a href="../register/">Create a free account</a></div>
    </div>
  </div>

<script>
var STORAGE_KEY = 'qc-theme';
var root = document.documentElement;
var SUN_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="#f2f0f8" stroke-width="1.7"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5M18.4 18.4l-1.5-1.5M7.1 7.1L5.6 5.6" stroke="#f2f0f8" stroke-width="1.7" stroke-linecap="round"/></svg>';
var MOON_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke="#100e2a" stroke-width="1.7" stroke-linejoin="round"/></svg>';
function applyTheme(dark) {
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
  try { localStorage.setItem(STORAGE_KEY, dark ? 'dark' : 'light'); } catch (e) {}
  var icon = document.getElementById('theme-toggle-icon');
  if (icon) icon.innerHTML = dark ? SUN_ICON : MOON_ICON;
}
window.toggleTheme = function () { applyTheme(root.getAttribute('data-theme') !== 'dark'); };
if (root.getAttribute('data-theme') === 'dark') applyTheme(true);

function qcToggleEye(btn) {
  const input = btn.closest(".field-inner").querySelector("input");
  input.type = input.type === "password" ? "text" : "password";
  btn.innerHTML = input.type === "password" ? "&#128065;" : "&#128584;";
}

const API_BASE = "https://app.querocura.com/api/auth";
const form = document.getElementById("qc-login-form");
const errBox = document.getElementById("qc-error");
const btn = document.getElementById("qc-submit-btn");
const btnLabel = btn.querySelector(".btn-label");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errBox.style.display = "none";
  btn.disabled = true;
  btnLabel.textContent = "Signing in…";

  const email = document.getElementById("qc-email").value.trim();
  const password = document.getElementById("qc-password").value;

  try {
    const res = await fetch(API_BASE + "/login", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();

    if (!res.ok || !data.ok) {
      throw new Error(data.message || "Couldn't sign you in. Check your email and password.");
    }

    window.location.href = "../dashboard/";
  } catch (err) {
    errBox.textContent = err.message || "Something went wrong. Please try again.";
    errBox.style.display = "block";
    btn.disabled = false;
    btnLabel.textContent = "Sign in";
  }
});
</script>
</body>
</html>
