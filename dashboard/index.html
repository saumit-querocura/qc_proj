<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — QueroCura</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="../icons/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      if (localStorage.getItem('qc-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: 'Manrope', sans-serif; background: #f6f5f1; color: #100e2a;
  }
  h1, h2, h3, .display { font-family: 'Space Grotesk', sans-serif; }
  a { color: #0e8f83; text-decoration: none; }
  a:hover { color: #0b6f66; }

  /* ---- Top bar (ditto index.html nav) ---- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px clamp(16px,4vw,32px); background: rgba(246,245,241,0.85); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(16,14,42,0.08); position: sticky; top: 0; z-index: 10;
  }
  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-wrap img { width: 38px; height: 35px; object-fit: contain; }
  .logo-text { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; font-family: 'Space Grotesk', sans-serif; }
  .logo-text .ink { color: #100e2a; }
  .logo-text .teal { color: #0e8f83; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .user-chip { font-size: 14px; font-weight: 600; color: rgba(16,14,42,0.75); }
  .signout-btn {
    background: transparent; border: 1.5px solid rgba(16,14,42,0.16); color: #100e2a;
    font-family: 'Manrope', sans-serif; font-size: 13.5px; font-weight: 700;
    padding: 9px 18px; border-radius: 999px; cursor: pointer; transition: transform 0.18s ease, background 0.18s ease;
  }
  .signout-btn:hover { background: rgba(16,14,42,0.06); transform: translateY(-2px); }
  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px;
    border-radius: 10px; border: 1.5px solid rgba(16,14,42,0.14); background: #fff; cursor: pointer;
    padding: 0; transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease; flex: 0 0 auto;
  }
  .theme-toggle:hover { transform: translateY(-2px); }

  /* ---- Layout ---- */
  .shell { display: flex; max-width: 1160px; margin: 0 auto; padding: 32px 24px 80px; gap: 28px; }
  .main { flex: 1; min-width: 0; }

  /* ---- Hero greeting (ditto login/register dark panel + moving gradients) ---- */
  .hero {
    position: relative; overflow: hidden; border-radius: 24px; margin-bottom: 22px;
    background: linear-gradient(165deg, #1a1740 0%, #100e2a 100%); color: #fff; padding: 30px 32px;
  }
  .hero-orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.5; pointer-events: none; animation: heroDrift 14s ease-in-out infinite; }
  .hero-orb1 { width: 220px; height: 220px; background: #0e8f83; top: -70px; right: 60px; }
  .hero-orb2 { width: 180px; height: 180px; background: #7c6fdb; bottom: -60px; left: 20%; animation-delay: -7s; }
  @keyframes heroDrift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(18px,-14px); } }
  .hero-eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; position: relative; z-index: 1; }
  .hero-tag { padding: 4px 12px; border-radius: 999px; background: rgba(126,224,212,0.16); border: 1px solid rgba(126,224,212,0.3); color: #7ee0d4; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .hero-live { display: flex; align-items: center; gap: 6px; font-size: 11px; color: rgba(255,255,255,0.55); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .hero-live-dot { width: 6px; height: 6px; border-radius: 50%; background: #7ee0d4; animation: heroBeacon 2.2s ease-out infinite; }
  @keyframes heroBeacon { 0% { box-shadow: 0 0 0 0 rgba(126,224,212,0.5); } 100% { box-shadow: 0 0 0 8px rgba(126,224,212,0); } }
  .hero-greeting { font-size: clamp(23px,3vw,31px); margin: 0 0 8px; position: relative; z-index: 1; }
  .hero-greeting .name {
    background: linear-gradient(95deg,#7ee0d4,#a89bf5); -webkit-background-clip: text; background-clip: text; color: transparent;
    background-size: 200% auto; animation: heroGradShift 5s ease-in-out infinite;
  }
  @keyframes heroGradShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .hero-sub { font-size: 14px; color: rgba(255,255,255,0.62); position: relative; z-index: 1; margin: 0; max-width: 480px; }
  .hero-date { font-size: 11.5px; color: rgba(255,255,255,0.4); margin-top: 14px; position: relative; z-index: 1; letter-spacing: 0.04em; }

  /* ---- Vitals snapshot strip ---- */
  .snapshot-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .snap-card { position: relative; overflow: hidden; background: #fff; border-radius: 16px; padding: 15px 16px 13px; border: 1px solid rgba(16,14,42,0.08); }
  .snap-card::before { content: ''; position: absolute; top: -28px; right: -28px; width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle, rgba(14,143,131,0.10), transparent 70%); pointer-events: none; }
  .snap-card .sc-icon { font-size: 17px; margin-bottom: 7px; }
  .snap-card .sc-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: rgba(16,14,42,0.45); margin-bottom: 3px; }
  .snap-card .sc-value { font-size: 18px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
  .snap-card .sc-value .unit { font-size: 11.5px; font-weight: 600; color: rgba(16,14,42,0.4); margin-left: 2px; }
  .snap-card.flag-CRITICAL { border-color: rgba(210,79,40,0.4); }
  .snap-card.flag-CRITICAL::before { background: radial-gradient(circle, rgba(210,79,40,0.14), transparent 70%); }
  .snap-card.flag-CAUTION { border-color: rgba(201,138,16,0.4); }
  .snap-card.flag-CAUTION::before { background: radial-gradient(circle, rgba(201,138,16,0.14), transparent 70%); }

  .card {
    position: relative; overflow: hidden;
    background: #fff; border-radius: 20px; padding: 26px 28px;
    border: 1px solid rgba(16,14,42,0.08); margin-bottom: 22px;
  }
  .card::before { content: ''; position: absolute; top: -44px; right: -44px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(14,143,131,0.06), transparent 70%); pointer-events: none; }
  .card h2 { font-size: 18px; margin: 0 0 18px; position: relative; }
  .card > * { position: relative; }

  /* ---- Vitals form ---- */
  .vitals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; color: rgba(16,14,42,0.7); }
  input, textarea {
    width: 100%; padding: 11px 13px; border-radius: 10px;
    border: 1.5px solid rgba(16,14,42,0.14); font-family: 'Manrope', sans-serif;
    font-size: 14.5px; color: #100e2a; background: #fff; outline: none;
  }
  input:focus, textarea:focus { border-color: #0e8f83; box-shadow: 0 0 0 3px rgba(14,143,131,0.12); }
  .notes-field { grid-column: 1 / -1; }
  .save-btn {
    position: relative; overflow: hidden;
    background: #0e8f83; color: #fff; font-size: 15px; font-weight: 700;
    padding: 12px 28px; border-radius: 999px; border: none; cursor: pointer;
    font-family: 'Manrope', sans-serif; margin-top: 18px;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  .save-btn::after {
    content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg); transition: left 0.6s ease; pointer-events: none;
  }
  .save-btn:hover:not(:disabled)::after { left: 140%; }
  .save-btn:hover:not(:disabled) { background: #0b6f66; transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(14,143,131,0.45); }
  .save-btn:disabled { opacity: 0.6; cursor: default; }
  .save-msg { font-size: 13.5px; font-weight: 600; margin-top: 12px; display: none; }
  .save-msg.ok { color: #0e8f83; display: block; }
  .save-msg.err { color: #b3401f; display: block; }

  /* ---- Latest / flags ---- */
  .summary-line { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .flag {
    display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px;
    border-radius: 12px; font-size: 13.5px; font-weight: 600; margin-bottom: 10px;
  }
  .flag.CRITICAL { background: #fdece7; color: #b3401f; }
  .flag.CAUTION { background: #fff5e0; color: #93670b; }
  .flag-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .flag.CRITICAL .flag-dot { background: #d24f28; }
  .flag.CAUTION .flag-dot { background: #c98a10; }
  .empty-note { font-size: 14px; color: rgba(16,14,42,0.5); }

  /* ---- History table ---- */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; padding: 10px 12px; color: rgba(16,14,42,0.55); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1.5px solid rgba(16,14,42,0.08); }
  td { padding: 12px; border-bottom: 1px solid rgba(16,14,42,0.06); }
  tr:last-child td { border-bottom: none; }

  /* ---- Sidebar nav ---- */
  .sidebar { width: 200px; flex-shrink: 0; }
  .sidebar a {
    display: block; padding: 11px 16px; border-radius: 12px; margin-bottom: 4px;
    color: rgba(16,14,42,0.7); text-decoration: none; font-size: 14.5px; font-weight: 600;
  }
  .sidebar a.active { background: #e6f6f4; color: #0e8f83; }
  .sidebar a:hover:not(.active) { background: rgba(16,14,42,0.04); }

  @media (max-width: 760px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; display: flex; gap: 6px; overflow-x: auto; }
    .sidebar a { white-space: nowrap; }
  }

  /* ---- Dark mode (same palette/keys as index.html) ---- */
  html[data-theme="dark"] body { background: #0d0c1f; color: #f2f0f8; }
  html[data-theme="dark"] a { color: #7ee0d4; }
  html[data-theme="dark"] a:hover { color: #9beee0; }
  html[data-theme="dark"] .topbar { background: rgba(13,12,31,0.85); border-bottom-color: rgba(255,255,255,0.1); }
  html[data-theme="dark"] .logo-text .ink { color: #f2f0f8; }
  html[data-theme="dark"] .user-chip { color: #cfccdf; }
  html[data-theme="dark"] .signout-btn { color: #f2f0f8; border-color: rgba(255,255,255,0.16); }
  html[data-theme="dark"] .signout-btn:hover { background: rgba(255,255,255,0.06); }
  html[data-theme="dark"] .theme-toggle { background: #18162e; border-color: rgba(255,255,255,0.14); }
  html[data-theme="dark"] .card { background: #18162e; border-color: rgba(255,255,255,0.1); }
  html[data-theme="dark"] .snap-card { background: #18162e; border-color: rgba(255,255,255,0.1); }
  html[data-theme="dark"] .snap-card .sc-label { color: #8f8ba3; }
  html[data-theme="dark"] .snap-card .sc-value .unit { color: #8f8ba3; }
  html[data-theme="dark"] .field label { color: #b7b3cc; }
  html[data-theme="dark"] input, html[data-theme="dark"] textarea { background: #100e2a; color: #f2f0f8; border-color: rgba(255,255,255,0.14); }
  html[data-theme="dark"] .flag.CRITICAL { background: rgba(210,79,40,0.16); color: #f0a488; }
  html[data-theme="dark"] .flag.CAUTION { background: rgba(201,138,16,0.16); color: #f0cd8a; }
  html[data-theme="dark"] .empty-note { color: #8f8ba3; }
  html[data-theme="dark"] th { color: #a9a6bd; border-bottom-color: rgba(255,255,255,0.12); }
  html[data-theme="dark"] td { border-bottom-color: rgba(255,255,255,0.08); }
  html[data-theme="dark"] .sidebar a { color: #cfccdf; }
  html[data-theme="dark"] .sidebar a.active { background: rgba(126,224,212,0.14); color: #7ee0d4; }
  html[data-theme="dark"] .sidebar a:hover:not(.active) { background: rgba(255,255,255,0.06); }
</style>
</head>
<body>
  <div class="topbar">
    <a class="logo-wrap" href="../">
      <img src="../assets/d4f7acc01b9438e998c9e7b9676584b0.png" alt="QueroCura">
      <span class="logo-text"><span class="ink">Quero</span><span class="teal">Cura</span></span>
    </a>
    <div class="topbar-right">
      <span class="user-chip" id="qc-user-chip"></span>
      <button class="signout-btn" id="qc-signout-btn">Sign out</button>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" id="theme-toggle-btn">
        <span id="theme-toggle-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke="#100e2a" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
      </button>
    </div>
  </div>

  <div class="shell">
    <nav class="sidebar">
      <a class="active" href="#">Dashboard</a>
    </nav>

    <div class="main">
      <div class="hero">
        <div class="hero-orb hero-orb1"></div>
        <div class="hero-orb hero-orb2"></div>
        <div class="hero-eyebrow">
          <span class="hero-tag">Dashboard</span>
          <span class="hero-live"><span class="hero-live-dot"></span>Live</span>
        </div>
        <h1 class="hero-greeting" id="qc-greeting">Welcome back</h1>
        <p class="hero-sub" id="qc-greeting-sub">Here's where things stand today.</p>
        <div class="hero-date" id="qc-today"></div>
      </div>

      <div class="snapshot-strip" id="qc-snapshot"></div>

      <div class="card">
        <h2>Flags &amp; notes</h2>
        <div id="qc-latest-summary" class="summary-line">Loading…</div>
        <div id="qc-flags"></div>
      </div>

      <div class="card">
        <h2>Record new vitals</h2>
        <form id="qc-vitals-form">
          <div class="vitals-grid">
            <div class="field">
              <label for="v-temp">Temperature (°C)</label>
              <input type="number" step="0.1" id="v-temp" name="temp">
            </div>
            <div class="field">
              <label for="v-sys">Systolic BP</label>
              <input type="number" id="v-sys" name="sys_bp">
            </div>
            <div class="field">
              <label for="v-dia">Diastolic BP</label>
              <input type="number" id="v-dia" name="dia_bp">
            </div>
            <div class="field">
              <label for="v-pulse">Pulse (bpm)</label>
              <input type="number" id="v-pulse" name="pulse">
            </div>
            <div class="field">
              <label for="v-spo2">SpO₂ (%)</label>
              <input type="number" id="v-spo2" name="spo2">
            </div>
            <div class="field">
              <label for="v-glucose">Glucose</label>
              <input type="number" step="0.1" id="v-glucose" name="glucose">
            </div>
            <div class="field">
              <label for="v-weight">Weight (kg)</label>
              <input type="number" step="0.1" id="v-weight" name="weight">
            </div>
            <div class="field notes-field">
              <label for="v-notes">Notes</label>
              <textarea id="v-notes" name="notes" rows="2"></textarea>
            </div>
          </div>
          <button type="submit" class="save-btn" id="qc-save-btn">Save reading</button>
          <div class="save-msg" id="qc-save-msg"></div>
        </form>
      </div>

      <div class="card">
        <h2>History</h2>
        <div id="qc-history-wrap">
          <div class="empty-note">Loading…</div>
        </div>
      </div>
    </div>
  </div>

<script>
var STORAGE_KEY = 'qc-theme';
var root = document.documentElement;
var SUN_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="#f2f0f8" stroke-width="1.7"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5M18.4 18.4l-1.5-1.5M7.1 7.1L5.6 5.6" stroke="#f2f0f8" stroke-width="1.7" stroke-linecap="round"/></svg>';
var MOON_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke="#100e2a" stroke-width="1.7" stroke-linejoin="round"/></svg>';
function applyTheme(dark) {
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
  try { localStorage.setItem(STORAGE_KEY, dark ? 'dark' : 'light'); } catch (e) {}
  var icon = document.getElementById('theme-toggle-icon');
  if (icon) icon.innerHTML = dark ? SUN_ICON : MOON_ICON;
}
window.toggleTheme = function () { applyTheme(root.getAttribute('data-theme') !== 'dark'); };
if (root.getAttribute('data-theme') === 'dark') applyTheme(true);

const API_BASE = "https://app.querocura.com/api";

function fmt(v) { return (v === null || v === undefined || v === "") ? "—" : v; }
function fmtDate(ts) {
  if (!ts) return "—";
  try { return new Date(ts.replace(" ", "T")).toLocaleString(); }
  catch (e) { return ts; }
}

async function requireSession() {
  const res = await fetch(API_BASE + "/auth/me", { credentials: "include" });
  const data = await res.json();
  if (!data.logged_in) {
    window.location.href = "../login/";
    return null;
  }
  return data.user;
}

async function requireCompletedProfile() {
  try {
    const res = await fetch(API_BASE + "/profile", { credentials: "include" });
    const data = await res.json();
    if (data.ok && data.profile && !data.profile.wizard_done) {
      window.location.href = "../onboarding/";
      return false;
    }
  } catch (e) {
    // If the check itself fails, don't block access to the dashboard.
  }
  return true;
}

function renderFlags(flags) {
  const box = document.getElementById("qc-flags");
  box.innerHTML = "";
  if (!flags || !flags.length) return;
  flags.forEach(f => {
    const el = document.createElement("div");
    el.className = "flag " + f.level;
    el.innerHTML = '<span class="flag-dot"></span><span>' + f.message + "</span>";
    box.appendChild(el);
  });
}

const SNAPSHOT_METRICS = [
  { key: "temp",    icon: "🌡️", label: "Temp",    unit: "°C", keywords: ["temperature"] },
  { key: "bp",      icon: "❤️", label: "BP",      unit: "",   keywords: ["blood pressure", "bp"] },
  { key: "pulse",   icon: "💓", label: "Pulse",   unit: "bpm",keywords: ["pulse"] },
  { key: "spo2",    icon: "🫁", label: "SpO₂",    unit: "%",  keywords: ["oxygen", "spo"] },
  { key: "glucose", icon: "🩸", label: "Glucose", unit: "",   keywords: ["glucose", "sugar"] },
  { key: "weight",  icon: "⚖️", label: "Weight",  unit: "kg", keywords: ["weight"] },
];

function flagSeverityFor(keywords, flags) {
  if (!flags || !flags.length) return "";
  for (const f of flags) {
    const msg = (f.message || "").toLowerCase();
    if (keywords.some(k => msg.includes(k))) return f.level || "";
  }
  return "";
}

function renderSnapshot(latest, flags) {
  const box = document.getElementById("qc-snapshot");
  latest = latest || {};
  const hasBp = latest.sys_bp != null && latest.dia_bp != null;
  box.innerHTML = SNAPSHOT_METRICS.map(m => {
    let value = "—", unit = m.unit;
    if (m.key === "bp") { value = hasBp ? (latest.sys_bp + "/" + latest.dia_bp) : "—"; unit = ""; }
    else if (latest[m.key] !== undefined && latest[m.key] !== null && latest[m.key] !== "") { value = latest[m.key]; }
    const sev = flagSeverityFor(m.keywords, flags);
    return '<div class="snap-card' + (sev ? ' flag-' + sev : '') + '">' +
      '<div class="sc-icon">' + m.icon + '</div>' +
      '<div class="sc-label">' + m.label + '</div>' +
      '<div class="sc-value">' + value + (value !== "—" && unit ? '<span class="unit">' + unit + '</span>' : '') + '</div>' +
    '</div>';
  }).join("");
}

function setGreetingChrome() {
  const hr = new Date().getHours();
  const word = hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening";
  document.getElementById("qc-today").textContent = new Date().toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  return word;
}

async function loadLatest() {
  const res = await fetch(API_BASE + "/vitals/latest", { credentials: "include" });
  const data = await res.json();
  document.getElementById("qc-latest-summary").textContent = data.summary || "No vitals recorded.";
  renderFlags(data.flags);
  renderSnapshot(data.latest, data.flags);
}

async function loadHistory() {
  const res = await fetch(API_BASE + "/vitals/history?limit=10", { credentials: "include" });
  const data = await res.json();
  const wrap = document.getElementById("qc-history-wrap");

  if (!data.history || !data.history.length) {
    wrap.innerHTML = '<div class="empty-note">No readings yet — record your first one above.</div>';
    return;
  }

  let rows = data.history.map(r => (
    "<tr>" +
      "<td>" + fmtDate(r.ts) + "</td>" +
      "<td>" + fmt(r.temp) + "</td>" +
      "<td>" + (r.sys_bp != null && r.dia_bp != null ? r.sys_bp + "/" + r.dia_bp : "—") + "</td>" +
      "<td>" + fmt(r.pulse) + "</td>" +
      "<td>" + fmt(r.spo2) + "</td>" +
      "<td>" + fmt(r.glucose) + "</td>" +
      "<td>" + fmt(r.weight) + "</td>" +
    "</tr>"
  )).join("");

  wrap.innerHTML =
    "<table><thead><tr>" +
      "<th>When</th><th>Temp</th><th>BP</th><th>Pulse</th><th>SpO₂</th><th>Glucose</th><th>Weight</th>" +
    "</tr></thead><tbody>" + rows + "</tbody></table>";
}

document.getElementById("qc-vitals-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("qc-save-btn");
  const msg = document.getElementById("qc-save-msg");
  btn.disabled = true;
  btn.textContent = "Saving…";
  msg.className = "save-msg";
  msg.textContent = "";

  const payload = {};
  payload.temp = document.getElementById("v-temp").value || null;
  payload.sys_bp = document.getElementById("v-sys").value || null;
  payload.dia_bp = document.getElementById("v-dia").value || null;
  payload.pulse = document.getElementById("v-pulse").value || null;
  payload.spo2 = document.getElementById("v-spo2").value || null;
  payload.glucose = document.getElementById("v-glucose").value || null;
  payload.weight = document.getElementById("v-weight").value || null;
  payload.notes = document.getElementById("v-notes").value || "";

  try {
    const res = await fetch(API_BASE + "/vitals", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.message || "Couldn't save that reading.");

    msg.classList.add("ok");
    msg.textContent = "Saved.";
    document.getElementById("qc-vitals-form").reset();
    await loadLatest();
    await loadHistory();
  } catch (err) {
    msg.classList.add("err");
    msg.textContent = err.message || "Something went wrong.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Save reading";
  }
});

document.getElementById("qc-signout-btn").addEventListener("click", async () => {
  await fetch(API_BASE + "/auth/logout", { method: "POST", credentials: "include" });
  window.location.href = "../";
});

(async function init() {
  const user = await requireSession();
  if (!user) return;
  const complete = await requireCompletedProfile();
  if (!complete) return;
  const name = user.display_name || user.username || user.email || "";
  const firstName = name ? name.split(" ")[0] : "";
  document.getElementById("qc-user-chip").textContent = name;
  const greetWord = setGreetingChrome();
  document.getElementById("qc-greeting").innerHTML = firstName
    ? (greetWord + ", <span class='name'>" + firstName + "</span> 👋")
    : (greetWord + " 👋");
  document.getElementById("qc-greeting-sub").textContent = "Here's where things stand today.";
  await loadLatest();
  await loadHistory();
})();
</script>
