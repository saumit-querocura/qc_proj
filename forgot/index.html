<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://app.querocura.com; connect-src 'self' https://app.querocura.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Forgot password — QueroCura</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/x-icon" href="../icons/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/qc-base.css">
<link rel="stylesheet" href="../assets/qc-account.css">
<script src="../assets/qc-csp.js"></script>
</head>
<body>
  <div class="topbar">
    <a class="logo-wrap" href="../">
      <img src="../assets/d4f7acc01b9438e998c9e7b9676584b0.png" alt="QueroCura">
      <span class="logo-text"><span class="ink">Quero</span><span class="teal">Cura</span></span>
    </a>
    <div class="topbar-right"><a class="btn btn-sm" href="../login/">Sign in</a></div>
  </div>

  <main class="solo">
    <div class="card solo-card">
      <div class="solo-emoji" aria-hidden="true">🔑</div>
      <h1 class="page-title">Forgot your password?</h1>
      <p class="page-sub">No worries. Enter the e-mail you signed up with and we'll send a link to choose a new one. It works once and expires in an hour.</p>
      <form id="forgot-form" novalidate>
        <div class="field"><label for="email">E-mail</label><input class="input" id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
        <button class="btn btn-primary" id="go" type="submit">Send me a reset link</button>
        <div class="msg" id="msg" role="status"></div>
      </form>
      <div id="dev" class="dev-note" hidden></div>
      <p class="hint" style="margin-top:18px">Remembered it? <a href="../login/">Back to sign in</a></p>
    </div>
  </main>
  <script src="../assets/qc-page.js"></script>
  <script src="../assets/js/forgot.js"></script>
</body>
</html>
