<script>
  (function () {
    try {
      if (localStorage.getItem('qc-theme') === 'dark') {

<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: 'Manrope', sans-serif; background: #f6f5f1; color: #100e2a; }
  h1, h2, h3, .display { font-family: 'Space Grotesk', sans-serif; }
  a { color: #0e8f83; text-decoration: none; }
  a:hover { color: #0b6f66; }

  /* ---- Top bar (ditto dashboard/symptoms) ---- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; padding: 14px clamp(16px,4vw,32px); background: rgba(246,245,241,0.88); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(16,14,42,0.08); position: sticky; top: 0; z-index: 20; }
  .logo-wrap { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .logo-wrap img { width: 34px; height: 31px; object-fit: contain; }
  .logo-text { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; font-family: 'Space Grotesk', sans-serif; }
  .logo-text .ink { color: #100e2a; } .logo-text .teal { color: #0e8f83; }
  .user-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; border-radius: 999px; background: rgba(16,14,42,0.05); font-size: 12.5px; font-weight: 700; color: rgba(16,14,42,0.75); margin-left: 4px; }
  .user-pill .up-dot { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg,#0e8f83,#2f8fd1); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; }
  .tab-nav { display: flex; align-items: center; gap: 4px; flex: 1 1 auto; justify-content: center; overflow-x: auto; scrollbar-width: none; }
  .tab-nav::-webkit-scrollbar { display: none; }
  .tab-link { display: flex; align-items: center; gap: 7px; white-space: nowrap; padding: 9px 15px; border-radius: 999px; font-size: 13.5px; font-weight: 700; color: rgba(16,14,42,0.55); transition: background 0.18s ease, color 0.18s ease; }
  .tab-link .tl-ic { font-size: 14px; }
  .tab-link:hover:not(.active):not(.soon) { background: rgba(16,14,42,0.05); color: #100e2a; }
  .tab-link.active { background: #100e2a; color: #fff; }
  .tab-link.soon { opacity: 0.45; cursor: default; }
  .tab-link.soon .soon-tag { font-size: 8.5px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; background: rgba(16,14,42,0.1); padding: 1px 6px; border-radius: 999px; margin-left: 2px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .signout-btn { background: #100e2a; border: none; color: #fff; font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700; padding: 9px 18px; border-radius: 999px; cursor: pointer; transition: transform 0.18s ease, background 0.18s ease; }
  .signout-btn:hover { background: #221f4d; transform: translateY(-2px); }
  .theme-toggle { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; border: 1.5px solid rgba(16,14,42,0.14); background: #fff; cursor: pointer; padding: 0; transition: transform 0.2s ease; flex: 0 0 auto; }
  .theme-toggle:hover { transform: translateY(-2px); }
  @media (max-width: 900px) { .tab-nav { order: 3; width: 100%; justify-content: flex-start; } }

  .shell { max-width: 900px; margin: 0 auto; padding: 32px 24px 90px; }
  .page-eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; background: rgba(14,143,131,0.08); border: 1px solid rgba(14,143,131,0.18); color: #0e8f83; font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px; }
  .page-title { font-family: 'Fraunces', serif; font-size: clamp(27px,4.2vw,36px); font-weight: 600; margin: 0 0 8px; }
  .page-sub { font-size: 14.5px; color: rgba(16,14,42,0.55); margin: 0 0 26px; max-width: 560px; line-height: 1.55; }

  /* ---- Hero identity card ---- */
  .id-hero { position: relative; overflow: hidden; border-radius: 26px; margin-bottom: 22px; background: radial-gradient(circle at 12% 15%, rgba(14,143,131,0.08), transparent 55%), radial-gradient(circle at 92% 10%, rgba(124,111,219,0.09), transparent 50%), #fbfaf6; border: 1px solid rgba(16,14,42,0.07); padding: 30px 32px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .id-avatar { width: 76px; height: 76px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0e8f83, #2f8fd1); color: #fff; font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px; box-shadow: 0 12px 26px -10px rgba(14,143,131,0.5); }
  .id-main { flex: 1; min-width: 200px; }
  .id-name { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; margin-bottom: 4px; }
  .id-meta { font-size: 13.5px; color: rgba(16,14,42,0.55); }
  .id-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .id-chip { font-size: 11.5px; font-weight: 700; padding: 4px 11px; border-radius: 999px; background: rgba(14,143,131,0.08); color: #0e8f83; border: 1px solid rgba(14,143,131,0.18); }
  .id-chip.warn { background: rgba(210,79,40,0.08); color: #b3401f; border-color: rgba(210,79,40,0.2); }
  .id-chip.info { background: rgba(124,111,219,0.08); color: #6a5cc2; border-color: rgba(124,111,219,0.2); }

  /* ---- Section cards ---- */
  .sec-card { position: relative; overflow: hidden; background: #fff; border-radius: 20px; padding: 24px 26px; border: 1px solid rgba(16,14,42,0.08); margin-bottom: 18px; }
  .sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .sec-ic { width: 38px; height: 38px; border-radius: 12px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 17px; background: var(--sec-tint, #e6f6f4); }
  .sec-title { font-size: 16.5px; font-weight: 700; flex: 1; }
  .sec-edit-btn { flex: 0 0 auto; background: transparent; border: 1.5px solid rgba(16,14,42,0.14); color: #100e2a; font-family: 'Manrope', sans-serif; font-size: 12.5px; font-weight: 700; padding: 7px 15px; border-radius: 999px; cursor: pointer; transition: all 0.18s ease; display: inline-flex; align-items: center; gap: 5px; }
  .sec-edit-btn:hover { background: rgba(16,14,42,0.05); }
  .sec-edit-btn.is-editing { background: #0e8f83; border-color: #0e8f83; color: #fff; }

  /* view mode: a clean two-column table of rows */
  .sec-table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  .sec-table tr { border-bottom: 1px solid rgba(16,14,42,0.06); }
  .sec-table tr:last-child { border-bottom: none; }
  .sec-table td { padding: 11px 4px; vertical-align: top; }
  .sec-table td.rlabel { width: 38%; font-size: 12.5px; font-weight: 700; color: rgba(16,14,42,0.5); text-transform: uppercase; letter-spacing: 0.03em; }
  .sec-table td.rvalue { font-size: 14.5px; font-weight: 600; color: #100e2a; }
  .rvalue .tagset { display: flex; flex-wrap: wrap; gap: 6px; }
  .rvalue .tag { font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 999px; background: rgba(14,143,131,0.08); color: #0e8f83; border: 1px solid rgba(14,143,131,0.16); }
  .rvalue .tag.empty-tag { background: rgba(16,14,42,0.05); color: rgba(16,14,42,0.4); border-color: rgba(16,14,42,0.08); font-weight: 600; }

  /* edit mode: reused pill/chip widgets, styled like onboarding */
  .edit-body { margin-top: 14px; }
  .field { margin-bottom: 18px; position: relative; }
  .field:last-child { margin-bottom: 0; }
  .field-inner { position: relative; }
  .field-input, textarea.field-input { width: 100%; padding: 20px 16px 8px; border-radius: 12px; border: 1.5px solid rgba(16,14,42,0.14); font-family: 'Manrope', sans-serif; font-size: 15px; color: #100e2a; background: #fbfaf6; outline: none; resize: vertical; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
  .field-input:focus { border-color: #0e8f83; box-shadow: 0 0 0 3px rgba(14,143,131,0.15); }
  .field-label { position: absolute; left: 16px; top: 18px; font-size: 15px; color: rgba(16,14,42,0.45); pointer-events: none; transition: all 0.15s ease; }
  .field-input:focus ~ .field-label, .field-input.filled ~ .field-label { top: 8px; font-size: 11px; font-weight: 700; color: #0e8f83; }
  .field-opt { font-weight: 500; color: rgba(16,14,42,0.4); }
  .esec-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: rgba(16,14,42,0.5); margin: 16px 0 9px; }
  .esec-label:first-child { margin-top: 0; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { padding: 9px 16px; border-radius: 999px; border: 1.5px solid rgba(16,14,42,0.14); font-size: 13px; font-weight: 700; cursor: pointer; background: #fff; color: #100e2a; transition: all 0.18s ease; user-select: none; }
  .pill:hover { border-color: rgba(14,143,131,0.5); transform: translateY(-1px); }
  .pill.sel { background: #100e2a; border-color: #100e2a; color: #fff; }
  .chip-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip { padding: 8px 15px; border-radius: 999px; border: 1.5px solid rgba(16,14,42,0.14); font-size: 13px; font-weight: 600; cursor: pointer; background: #fff; color: #100e2a; transition: all 0.18s ease; user-select: none; }
  .chip:hover { border-color: rgba(14,143,131,0.5); transform: translateY(-1px); }
  .chip.sel { background: #e6f6f4; border-color: #0e8f83; color: #0b6f66; }
  .chip.none-chip.sel { background: #100e2a; border-color: #100e2a; color: #fff; }
  .extra-input { width: 100%; padding: 10px 14px; border-radius: 10px; margin-top: 4px; border: 1.5px dashed rgba(16,14,42,0.2); font-family: 'Manrope', sans-serif; font-size: 13px; color: #100e2a; background: transparent; outline: none; }
  .extra-input:focus { border-color: #0e8f83; border-style: solid; }
  .extra-input::placeholder { color: rgba(16,14,42,0.4); }
  .edit-footer { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
  .btn-save { background: #0e8f83; color: #fff; font-size: 13.5px; font-weight: 700; padding: 10px 22px; border-radius: 999px; border: none; cursor: pointer; font-family: 'Manrope', sans-serif; transition: all 0.18s ease; }
  .btn-save:hover:not(:disabled) { background: #0b6f66; transform: translateY(-1px); }
  .btn-save:disabled { opacity: 0.6; cursor: default; }
  .btn-cancel { background: transparent; border: 1.5px solid rgba(16,14,42,0.14); color: #100e2a; font-size: 13.5px; font-weight: 700; padding: 10px 18px; border-radius: 999px; cursor: pointer; font-family: 'Manrope', sans-serif; }
  .btn-cancel:hover { background: rgba(16,14,42,0.05); }
  .save-note { font-size: 12.5px; font-weight: 600; color: #0e8f83; opacity: 0; transition: opacity 0.3s ease; }
  .save-note.show { opacity: 1; }

  .skeleton-line { height: 14px; border-radius: 6px; background: rgba(16,14,42,0.07); margin: 10px 0; animation: skPulse 1.3s ease-in-out infinite; }
  @keyframes skPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

  @media (max-width: 620px) { .sec-table td.rlabel { width: 44%; } .id-hero { padding: 24px 20px; } }

  /* ---- Dark mode ---- */
  html[data-theme="dark"] body { background: #0d0c1f; color: #f2f0f8; }
  html[data-theme="dark"] a { color: #7ee0d4; }
  html[data-theme="dark"] .topbar { background: rgba(13,12,31,0.88); border-bottom-color: rgba(255,255,255,0.1); }
  html[data-theme="dark"] .logo-text .ink { color: #f2f0f8; }
  html[data-theme="dark"] .user-pill { background: rgba(255,255,255,0.06); color: #cfccdf; }
  html[data-theme="dark"] .tab-link { color: #a9a6bd; }
  html[data-theme="dark"] .tab-link:hover:not(.active):not(.soon) { background: rgba(255,255,255,0.06); color: #f2f0f8; }
  html[data-theme="dark"] .tab-link.active { background: #7ee0d4; color: #100e2a; }
  html[data-theme="dark"] .signout-btn { background: #7ee0d4; color: #100e2a; }
  html[data-theme="dark"] .signout-btn:hover { background: #9beee0; }
  html[data-theme="dark"] .theme-toggle { background: #18162e; border-color: rgba(255,255,255,0.14); }
  html[data-theme="dark"] .page-sub { color: #b7b3cc; }
  html[data-theme="dark"] .page-eyebrow { background: rgba(126,224,212,0.1); border-color: rgba(126,224,212,0.22); color: #7ee0d4; }
  html[data-theme="dark"] .id-hero { background: radial-gradient(circle at 12% 15%, rgba(126,224,212,0.08), transparent 55%), radial-gradient(circle at 92% 10%, rgba(168,155,245,0.1), transparent 50%), #15132c; border-color: rgba(255,255,255,0.08); }
  html[data-theme="dark"] .id-meta { color: #a9a6bd; }
  html[data-theme="dark"] .id-chip { background: rgba(126,224,212,0.1); color: #7ee0d4; border-color: rgba(126,224,212,0.22); }
  html[data-theme="dark"] .id-chip.warn { background: rgba(210,79,40,0.16); color: #f0a488; border-color: rgba(210,79,40,0.28); }
  html[data-theme="dark"] .id-chip.info { background: rgba(124,111,219,0.16); color: #b9adf2; border-color: rgba(124,111,219,0.3); }
  html[data-theme="dark"] .sec-card { background: #18162e; border-color: rgba(255,255,255,0.1); }
  html[data-theme="dark"] .sec-edit-btn { color: #f2f0f8; border-color: rgba(255,255,255,0.16); }
  html[data-theme="dark"] .sec-edit-btn:hover { background: rgba(255,255,255,0.06); }
  html[data-theme="dark"] .sec-table tr { border-bottom-color: rgba(255,255,255,0.08); }
  html[data-theme="dark"] .sec-table td.rlabel { color: #a9a6bd; }
  html[data-theme="dark"] .sec-table td.rvalue { color: #f2f0f8; }
  html[data-theme="dark"] .rvalue .tag { background: rgba(126,224,212,0.1); color: #7ee0d4; border-color: rgba(126,224,212,0.22); }
  html[data-theme="dark"] .rvalue .tag.empty-tag { background: rgba(255,255,255,0.06); color: #8f8ba3; border-color: rgba(255,255,255,0.1); }
  html[data-theme="dark"] .field-input { background: #100e2a; color: #f2f0f8; border-color: rgba(255,255,255,0.14); }
  html[data-theme="dark"] .field-label { color: #8f8ba3; }
  html[data-theme="dark"] .esec-label { color: #8f8ba3; }
  html[data-theme="dark"] .pill { background: #100e2a; color: #f2f0f8; border-color: rgba(255,255,255,0.16); }
  html[data-theme="dark"] .pill.sel { background: #7ee0d4; border-color: #7ee0d4; color: #0d0c1f; }
  html[data-theme="dark"] .chip { background: #100e2a; color: #f2f0f8; border-color: rgba(255,255,255,0.16); }
  html[data-theme="dark"] .chip.sel { background: rgba(126,224,212,0.16); border-color: #7ee0d4; color: #7ee0d4; }
  html[data-theme="dark"] .chip.none-chip.sel { background: #7ee0d4; border-color: #7ee0d4; color: #0d0c1f; }
  html[data-theme="dark"] .extra-input { color: #f2f0f8; border-color: rgba(255,255,255,0.2); }
  html[data-theme="dark"] .btn-cancel { color: #f2f0f8; border-color: rgba(255,255,255,0.18); }
  html[data-theme="dark"] .btn-cancel:hover { background: rgba(255,255,255,0.06); }
  html[data-theme="dark"] .skeleton-line { background: rgba(255,255,255,0.08); }
</style>
</head>

<script>
var STORAGE_KEY = 'qc-theme';
var root = document.documentElement;
var SUN_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="#f2f0f8" stroke-width="1.7"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5M18.4 18.4l-1.5-1.5M7.1 7.1L5.6 5.6" stroke="#f2f0f8" stroke-width="1.7" stroke-linecap="round"/></svg>';
var MOON_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke="#100e2a" stroke-width="1.7" stroke-linejoin="round"/></svg>';
function applyTheme(dark) {
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
  try { localStorage.setItem(STORAGE_KEY, dark ? 'dark' : 'light'); } catch (e) {}
  var icon = document.getElementById('theme-toggle-icon');
  if (icon) icon.innerHTML = dark ? SUN_ICON : MOON_ICON;
}
window.toggleTheme = function () { applyTheme(root.getAttribute('data-theme') !== 'dark'); };
if (root.getAttribute('data-theme') === 'dark') applyTheme(true);

const API_BASE = "https://app.querocura.com/api";

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function cap(s) { s = String(s || ""); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

let options = null;
let state = {
  display_name: "", age: "", sex: "unknown", blood_type: "unknown",
  med_allergies: [], food_allergies: [], env_allergies: [],
  conditions: [], medications: "", family_history: [],
  smoking: "unknown", alcohol: "unknown", exercise: "unknown",
  pregnant: false, occupation: "",
};
let savedSnapshot = null; // last-saved state, for Cancel to restore from
let userInfo = null;

function mergeProfileIntoState(p) {
  if (!p) return;
  ["display_name","sex","blood_type","medications","smoking","alcohol","exercise","occupation"].forEach(k => {
    if (p[k] !== undefined && p[k] !== null) state[k] = p[k];
  });
  if (p.age !== undefined && p.age !== null) state.age = p.age;
  ["med_allergies","food_allergies","env_allergies","conditions","family_history"].forEach(k => {
    if (Array.isArray(p[k])) state[k] = p[k].slice();
  });
  if (typeof p.pregnant === "boolean") state.pregnant = p.pregnant;
}

async function saveProfile() {
  const payload = Object.assign({}, state, { wizard_done: true });
  const res = await fetch(API_BASE + "/profile", {
    method: "POST", credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  const data = await res.json();
  if (!res.ok || !data.ok) throw new Error(data.message || "Couldn't save your profile.");
  return data;
}

/* ---- Reusable field widgets (ported from the onboarding wizard) ---- */
function pillRow(cat, opts, labelsMap) {
  return '<div class="pill-row">' + opts.map(v => {
    const label = (labelsMap && labelsMap[v]) || cap(v);
    return '<span class="pill' + (state[cat] === v ? ' sel' : '') + '" data-cat="' + cat + '" data-v="' + esc(v) + '" onclick="qcPickPill(this)">' + esc(label) + '</span>';
  }).join("") + '</div>';
}
window.qcPickPill = function (el) {
  const cat = el.dataset.cat, v = el.dataset.v;
  el.closest(".pill-row").querySelectorAll('.pill[data-cat="' + cat + '"]').forEach(p => p.classList.remove('sel'));
  el.classList.add('sel');
  state[cat] = v;
};

function chipCloud(cat, items) {
  const cur = state[cat] || [];
  const isNoneSel = cur.length === 0;
  let html = '<div class="chip-cloud">';
  items.forEach(item => {
    if (item === "None") {
      html += '<span class="chip none-chip' + (isNoneSel ? ' sel' : '') + '" data-cat="' + cat + '" data-v="__none__" onclick="qcToggleChip(this)">None</span>';
    } else {
      html += '<span class="chip' + (cur.includes(item) ? ' sel' : '') + '" data-cat="' + cat + '" data-v="' + esc(item) + '" onclick="qcToggleChip(this)">' + esc(item) + '</span>';
    }
  });
  cur.filter(v => !items.includes(v)).forEach(v => {
    html += '<span class="chip sel custom-chip" data-cat="' + cat + '" data-v="' + esc(v) + '" onclick="qcToggleChip(this)">' + esc(v) + ' ×</span>';
  });
  html += '</div>';
  return html;
}
window.qcToggleChip = function (el) {
  const cat = el.dataset.cat, v = el.dataset.v;
  const cloud = el.closest(".chip-cloud");
  if (v === "__none__") {
    state[cat] = [];
    cloud.querySelectorAll('.chip[data-cat="' + cat + '"]').forEach(c => c.classList.remove('sel'));
    el.classList.add('sel');
    return;
  }
  const arr = state[cat];
  const idx = arr.indexOf(v);
  if (idx === -1) { arr.push(v); el.classList.add('sel'); }
  else { arr.splice(idx, 1); el.classList.remove('sel'); }
  const noneChip = cloud.querySelector('.chip.none-chip[data-cat="' + cat + '"]');
  if (noneChip) noneChip.classList.toggle('sel', arr.length === 0);
};

function extraTagInput(cat, placeholder) {
  return '<input type="text" class="extra-input" placeholder="' + esc(placeholder) + '" ' +
    'onkeydown="if(event.key===\'Enter\'){event.preventDefault(); qcAddExtraTags(this,\'' + cat + '\');}" ' +
    'onblur="qcAddExtraTags(this,\'' + cat + '\')">';
}
window.qcAddExtraTags = function (input, cat) {
  const raw = input.value.trim();
  if (!raw) return;
  const tokens = raw.split(",").map(t => t.trim()).filter(Boolean);
  tokens.forEach(t => { if (!state[cat].includes(t)) state[cat].push(t); });
  input.value = "";
  renderSection(input.closest(".sec-card").dataset.sec, true);
};

function floatField(id, cat, label, type, opt) {
  opt = opt || {};
  const val = state[cat] == null ? "" : state[cat];
  const filled = val !== "" ? " filled" : "";
  const tag = type === "textarea" ? "textarea" : "input";
  const openTag = tag === "textarea"
    ? '<textarea class="field-input' + filled + '" id="' + id + '" rows="' + (opt.rows || 3) + '" placeholder=" " ' +
        'oninput="qcSetText(this,\'' + cat + '\')">' + esc(val) + '</textarea>'
    : '<input class="field-input' + filled + '" id="' + id + '" type="' + (type || "text") + '" placeholder=" " value="' + esc(val) + '" ' +
        (opt.min !== undefined ? 'min="' + opt.min + '" ' : '') + (opt.max !== undefined ? 'max="' + opt.max + '" ' : '') +
        'oninput="qcSetText(this,\'' + cat + '\')">';
  return '<div class="field"><div class="field-inner">' + openTag +
    '<label class="field-label" for="' + id + '">' + esc(label) + (opt.optional ? ' <span class="field-opt">optional</span>' : '') + '</label>' +
    '</div></div>';
}
window.qcSetText = function (el, cat) {
  el.classList.toggle('filled', el.value.length > 0);
  state[cat] = cat === 'age' ? (el.value === '' ? '' : el.value) : el.value;
};

/* ---- Section definitions ---- */
const SEX_LABELS = { unknown: "Prefer not to say" };
const BLOOD_LABELS = { unknown: "Unknown" };
const LIFESTYLE_LABELS = { unknown: "Prefer not to say", none: "None" };

function tagset(arr, emptyText) {
  if (!arr || !arr.length) return '<span class="tag empty-tag">' + esc(emptyText || "None recorded") + '</span>';
  return '<div class="tagset">' + arr.map(v => '<span class="tag">' + esc(v) + '</span>').join("") + '</div>';
}

const SECTIONS = [
  {
    key: "basics", title: "Basics", icon: "👋", tint: "#e6f6f4",
    view: () => [
      ["Name", esc(state.display_name || "—")],
      ["Age", esc(state.age || "—")],
      ["Sex", esc((SEX_LABELS[state.sex]) || cap(state.sex))],
      ["Blood group", esc((BLOOD_LABELS[state.blood_type]) || cap(state.blood_type))],
    ],
    edit: () =>
      floatField("f-name", "display_name", "What should we call you?", "text") +
      floatField("f-age", "age", "Age", "number", { min: 1, max: 120, optional: true }) +
      '<div class="esec-label">Biological sex</div>' + pillRow("sex", options.sex_options, SEX_LABELS) +
      '<div class="esec-label">ABO blood group <span class="field-opt">optional</span></div>' + pillRow("blood_type", options.blood_types, BLOOD_LABELS),
  },
  {
    key: "allergies", title: "Allergies", icon: "⚠️", tint: "#fdece7",
    view: () => [
      ["Medication", tagset(state.med_allergies)],
      ["Food", tagset(state.food_allergies)],
      ["Environmental", tagset(state.env_allergies)],
    ],
    edit: () =>
      '<div class="esec-label">Medication allergies</div>' + chipCloud("med_allergies", options.common_med_allergies) + extraTagInput("med_allergies", "Add another, comma separated — then press Enter") +
      '<div class="esec-label">Food allergies</div>' + chipCloud("food_allergies", options.common_food_allergies) + extraTagInput("food_allergies", "Add another, comma separated — then press Enter") +
      '<div class="esec-label">Environmental allergies</div>' + chipCloud("env_allergies", options.common_env_allergies) + extraTagInput("env_allergies", "Add another, comma separated — then press Enter"),
  },
  {
    key: "history", title: "Health history", icon: "📋", tint: "#eae8fb",
    view: () => [
      ["Known conditions", tagset(state.conditions)],
    ],
    edit: () =>
      '<div class="esec-label">Known conditions</div>' + chipCloud("conditions", options.known_conditions) + extraTagInput("conditions", "Add another condition, comma separated — then press Enter"),
  },
  {
    key: "meds", title: "Medications & family", icon: "💊", tint: "#fbf1dc",
    view: () => [
      ["Current medications", esc(state.medications || "—")],
      ["Family history", tagset(state.family_history)],
    ],
    edit: () =>
      floatField("f-meds", "medications", "Current medications", "textarea", { rows: 3, optional: true }) +
      '<div class="esec-label">Family history</div>' + chipCloud("family_history", options.known_family_history) + extraTagInput("family_history", "Add another, comma separated — then press Enter"),
  },
  {
    key: "lifestyle", title: "Lifestyle", icon: "🏃", tint: "#e4f1fb",
    view: () => [
      ["Smoking", esc((LIFESTYLE_LABELS[state.smoking]) || cap(state.smoking))],
      ["Alcohol", esc((LIFESTYLE_LABELS[state.alcohol]) || cap(state.alcohol))],
      ["Exercise", esc((LIFESTYLE_LABELS[state.exercise]) || cap(state.exercise))],
    ],
    edit: () =>
      '<div class="esec-label">Smoking</div>' + pillRow("smoking", options.smoking_options, LIFESTYLE_LABELS) +
      '<div class="esec-label">Alcohol</div>' + pillRow("alcohol", options.alcohol_options, LIFESTYLE_LABELS) +
      '<div class="esec-label">Exercise</div>' + pillRow("exercise", options.exercise_options, LIFESTYLE_LABELS),
  },
  {
    key: "other", title: "Pregnancy & occupation", icon: "✨", tint: "#e6f6f4",
    view: () => [
      ["Currently pregnant", state.pregnant ? "Yes" : "No"],
      ["Occupation", esc(state.occupation || "—")],
    ],
    edit: () =>
      '<div class="esec-label">Pregnant</div><div class="pill-row">' +
        '<span class="pill' + (state.pregnant ? ' sel' : '') + '" data-preg="1" onclick="qcSetPregnant(this,true)">Yes</span>' +
        '<span class="pill' + (!state.pregnant ? ' sel' : '') + '" data-preg="0" onclick="qcSetPregnant(this,false)">No</span>' +
      '</div>' +
      floatField("f-occ", "occupation", "Occupation", "text", { optional: true }),
  },
];
window.qcSetPregnant = function (el, val) {
  el.closest(".pill-row").querySelectorAll('.pill[data-preg]').forEach(p => p.classList.remove('sel'));
  el.classList.add('sel');
  state.pregnant = val;
};

const editingSet = new Set();

function renderAllSections() {
  const box = document.getElementById("qc-sections");
  box.innerHTML = SECTIONS.map(sec => sectionHtml(sec)).join("");
}

function sectionHtml(sec) {
  const isEditing = editingSet.has(sec.key);
  let body;
  if (isEditing) {
    body = '<div class="edit-body">' + sec.edit() +
      '<div class="edit-footer">' +
        '<button type="button" class="btn-save" onclick="qcSaveSection(\'' + sec.key + '\')">Save changes</button>' +
        '<button type="button" class="btn-cancel" onclick="qcCancelSection(\'' + sec.key + '\')">Cancel</button>' +
        '<span class="save-note" id="qc-save-note-' + sec.key + '">Saved ✓</span>' +
      '</div></div>';
  } else {
    body = '<table class="sec-table">' + sec.view().map(([l, v]) =>
      '<tr><td class="rlabel">' + esc(l) + '</td><td class="rvalue">' + v + '</td></tr>'
    ).join("") + '</table>';
  }
  return '<div class="sec-card" data-sec="' + sec.key + '">' +
    '<div class="sec-head">' +
      '<div class="sec-ic" style="--sec-tint:' + sec.tint + '">' + sec.icon + '</div>' +
      '<div class="sec-title">' + esc(sec.title) + '</div>' +
      '<button type="button" class="sec-edit-btn' + (isEditing ? ' is-editing' : '') + '" onclick="qcToggleEdit(\'' + sec.key + '\')">' +
        (isEditing ? 'Editing…' : '✎ Edit') +
      '</button>' +
    '</div>' + body +
  '</div>';
}

function renderSection(key, keepEditing) {
  const card = document.querySelector('.sec-card[data-sec="' + key + '"]');
  if (!card) return;
  const sec = SECTIONS.find(s => s.key === key);
  if (keepEditing) editingSet.add(key);
  card.outerHTML = sectionHtml(sec);
}

window.qcToggleEdit = function (key) {
  if (editingSet.has(key)) editingSet.delete(key);
  else editingSet.add(key);
  renderSection(key, editingSet.has(key));
};

window.qcCancelSection = function (key) {
  if (savedSnapshot) {
    mergeProfileIntoState(savedSnapshot);
  }
  editingSet.delete(key);
  renderSection(key, false);
};

window.qcSaveSection = async function (key) {
  const card = document.querySelector('.sec-card[data-sec="' + key + '"]');
  const saveBtn = card.querySelector(".btn-save");
  saveBtn.disabled = true;
  saveBtn.textContent = "Saving…";
  try {
    const data = await saveProfile();
    savedSnapshot = data.profile || Object.assign({}, state);
    updateIdHero();
    editingSet.delete(key);
    renderSection(key, false);
    const note = document.getElementById("qc-save-note-" + key);
    // renderSection just replaced the DOM, so re-find isn't needed here --
    // the card is back in view mode. Show a brief confirmation instead by
    // flashing the section border.
    const freshCard = document.querySelector('.sec-card[data-sec="' + key + '"]');
    if (freshCard) {
      freshCard.style.transition = "box-shadow 0.3s ease";
      freshCard.style.boxShadow = "0 0 0 2px rgba(14,143,131,0.4)";
      setTimeout(() => { freshCard.style.boxShadow = ""; }, 900);
    }
  } catch (err) {
    saveBtn.disabled = false;
    saveBtn.textContent = "Save changes";
    alert(err.message || "Couldn't save your profile. Please try again.");
  }
};

function updateIdHero() {
  const name = state.display_name || (userInfo && (userInfo.display_name || userInfo.username || userInfo.email)) || "—";
  document.getElementById("qc-id-name").textContent = name;
  const initials = name && name !== "—" ? name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join("") : "?";
  document.getElementById("qc-id-avatar").textContent = initials;
  document.getElementById("qc-user-dot").textContent = initials;
  document.getElementById("qc-user-name").textContent = name !== "—" ? name.split(" ")[0] : "";

  const bits = [];
  if (state.age) bits.push(state.age + " y/o");
  if (state.sex && state.sex !== "unknown") bits.push(cap(state.sex));
  if (state.occupation) bits.push(state.occupation);
  document.getElementById("qc-id-meta").textContent = bits.length ? bits.join(" · ") : "No extra details yet — tap Edit below to fill this in.";

  const chipsBox = document.getElementById("qc-id-chips");
  const chips = [];
  const allergies = [].concat(state.med_allergies || [], state.food_allergies || [], state.env_allergies || []);
  allergies.slice(0, 5).forEach(a => chips.push('<span class="id-chip warn">⚠ ' + esc(a) + '</span>'));
  (state.conditions || []).slice(0, 3).forEach(c => chips.push('<span class="id-chip info">' + esc(c) + '</span>'));
  if (state.pregnant) chips.push('<span class="id-chip info">Pregnant</span>');
  chipsBox.innerHTML = chips.length ? chips.join("") : '<span class="id-chip">No allergies or conditions on file</span>';
}

document.getElementById("qc-signout-btn").addEventListener("click", async () => {
  await fetch(API_BASE + "/auth/logout", { method: "POST", credentials: "include" });
  window.location.href = "../";
});

(async function init() {
  const [meData, profData, optData] = await Promise.all([
    fetch(API_BASE + "/auth/me", { credentials: "include" }).then(r => r.json()).catch(() => ({ logged_in: false })),
    fetch(API_BASE + "/profile", { credentials: "include" }).then(r => r.json()).catch(() => null),
    fetch(API_BASE + "/profile/options", { credentials: "include" }).then(r => r.json()).catch(() => null),
  ]);
  if (!meData.logged_in) { window.location.href = "../login/"; return; }
  userInfo = meData.user;
  options = (optData && optData.options) || {
    known_conditions: [], known_family_history: [], common_med_allergies: [],
    common_food_allergies: [], common_env_allergies: [], blood_types: ["unknown"],
    sex_options: ["unknown"], smoking_options: ["unknown"], alcohol_options: ["unknown"],
    exercise_options: ["unknown"],
  };

  if (profData && profData.ok && profData.profile && !profData.profile.wizard_done) {
    // Never been through setup at all -- that belongs in the wizard, not
    // an edit view of a profile that doesn't exist yet.
    window.location.href = "../onboarding/";
    return;
  }
  if (profData && profData.ok && profData.profile) {
    mergeProfileIntoState(profData.profile);
    savedSnapshot = profData.profile;
  }

  updateIdHero();
  renderAllSections();
})();
</script>
