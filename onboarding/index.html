<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up your profile — QueroCura</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="../icons/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://app.querocura.com">
<link rel="dns-prefetch" href="https://app.querocura.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      if (localStorage.getItem('qc-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh;
    font-family: 'Manrope', sans-serif; background: #f6f5f1; color: #100e2a;
  }
  h1, h2, h3, .display { font-family: 'Space Grotesk', sans-serif; }
  a { color: #0e8f83; text-decoration: none; }
  a:hover { color: #0b6f66; }

  /* ---- Topbar (ditto index.html nav) ---- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px clamp(16px,4vw,32px); background: rgba(246,245,241,0.85); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(16,14,42,0.08); position: sticky; top: 0; z-index: 10;
  }
  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-wrap img { width: 38px; height: 35px; object-fit: contain; }
  .logo-text { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; font-family: 'Space Grotesk', sans-serif; }
  .logo-text .ink { color: #100e2a; }
  .logo-text .teal { color: #0e8f83; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .navlink { color: #100e2a; font-size: 14px; font-weight: 700; }
  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px;
    border-radius: 10px; border: 1.5px solid rgba(16,14,42,0.14); background: #fff; cursor: pointer;
    padding: 0; transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease; flex: 0 0 auto;
  }
  .theme-toggle:hover { transform: translateY(-2px); }

  /* ---- Progress ---- */
  .progress-wrap { max-width: 680px; margin: 0 auto; padding: 28px 20px 0; }
  .progress-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .progress-step-label { font-size: 13px; font-weight: 700; color: rgba(16,14,42,0.55); }
  .progress-track { height: 6px; border-radius: 6px; background: rgba(16,14,42,0.08); overflow: hidden; }
  .progress-fill {
    position: relative; height: 100%; border-radius: 6px;
    background: linear-gradient(95deg, #0e8f83, #2f8fd1, #7c6fdb, #0e8f83);
    background-size: 300% auto; animation: progressShimmer 3.5s linear infinite;
    transition: width 0.45s cubic-bezier(0.4,0,0.2,1);
  }
  @keyframes progressShimmer { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }

  /* ---- Card shell ---- */
  .wrap { max-width: 680px; margin: 0 auto; padding: 22px 20px 60px; }
  .card {
    position: relative; overflow: hidden;
    background: #fff; border-radius: 26px; padding: 38px 36px;
    border: 1px solid rgba(16,14,42,0.08); box-shadow: 0 24px 60px -20px rgba(16,14,42,0.16);
    animation: fadeSlideIn 0.4s cubic-bezier(0.2,0.9,0.3,1) both;
  }
  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .step-glow {
    position: absolute; inset: 0; opacity: 0.6; pointer-events: none;
    background: radial-gradient(520px circle at 88% -10%, var(--step-tint, rgba(14,143,131,0.14)), transparent 60%);
    animation: glowDrift 9s ease-in-out infinite;
  }
  @keyframes glowDrift {
    0%,100% { background-position: 0 0; }
    50% { background-position: -30px 20px; }
  }
  .finish-flourish {
    position: absolute; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; background: linear-gradient(165deg, #1a1740 0%, #100e2a 100%);
    color: #fff; text-align: center; border-radius: 26px;
  }
  .finish-flourish.show { display: flex; animation: fadeSlideIn 0.3s ease both; }
  .finish-check {
    width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0e8f83, #2f8fd1); font-size: 30px;
    animation: checkPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    box-shadow: 0 0 0 8px rgba(14,143,131,0.16);
  }
  @keyframes checkPop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .finish-flourish h2 { font-size: 20px; margin: 0; }
  .finish-flourish p { font-size: 13.5px; color: rgba(255,255,255,0.6); margin: 0; }
  .step-head { position: relative; display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .step-icon {
    width: 46px; height: 46px; border-radius: 14px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; font-size: 21px;
    background: var(--step-tint, #e6f6f4);
  }
  .step-title { font-size: 22px; margin: 0; }
  .step-hint { position: relative; margin: 0 0 26px; color: rgba(16,14,42,0.6); font-size: 14px; line-height: 1.5; }

  .field { margin-bottom: 20px; position: relative; }
  .field-inner { position: relative; }
  .field-input, textarea.field-input {
    width: 100%; padding: 20px 16px 8px; border-radius: 12px;
    border: 1.5px solid rgba(16,14,42,0.14); font-family: 'Manrope', sans-serif;
    font-size: 15px; color: #100e2a; background: #fff; outline: none; resize: vertical;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .field-input:focus { border-color: #0e8f83; box-shadow: 0 0 0 3px rgba(14,143,131,0.15); }
  .field-label {
    position: absolute; left: 16px; top: 18px; font-size: 15px; color: rgba(16,14,42,0.45);
    pointer-events: none; transition: all 0.15s ease;
  }
  .field-input:focus ~ .field-label, .field-input.filled ~ .field-label {
    top: 8px; font-size: 11px; font-weight: 700; color: #0e8f83;
  }
  .field-opt { font-weight: 500; color: rgba(16,14,42,0.4); }

  .sec-label { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: rgba(16,14,42,0.5); margin: 22px 0 10px; }
  .sec-label:first-child { margin-top: 0; }

  /* ---- Pills (single-select) ---- */
  .pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    padding: 10px 18px; border-radius: 999px; border: 1.5px solid rgba(16,14,42,0.14);
    font-size: 13.5px; font-weight: 700; cursor: pointer; background: #fff; color: #100e2a;
    transition: all 0.18s ease; user-select: none;
  }
  .pill:hover { border-color: rgba(14,143,131,0.5); transform: translateY(-1px); }
  .pill.sel { background: #100e2a; border-color: #100e2a; color: #fff; }

  /* ---- Chips (multi-select tag cloud) ---- */
  .chip-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip {
    padding: 9px 16px; border-radius: 999px; border: 1.5px solid rgba(16,14,42,0.14);
    font-size: 13.5px; font-weight: 600; cursor: pointer; background: #fff; color: #100e2a;
    transition: all 0.18s ease; user-select: none;
  }
  .chip:hover { border-color: rgba(14,143,131,0.5); transform: translateY(-1px); }
  .chip.sel { background: #e6f6f4; border-color: #0e8f83; color: #0b6f66; }
  .chip.none-chip.sel { background: #100e2a; border-color: #100e2a; color: #fff; }
  .extra-input {
    width: 100%; padding: 11px 14px; border-radius: 10px; margin-top: 4px;
    border: 1.5px dashed rgba(16,14,42,0.2); font-family: 'Manrope', sans-serif;
    font-size: 13.5px; color: #100e2a; background: transparent; outline: none;
  }
  .extra-input:focus { border-color: #0e8f83; border-style: solid; }
  .extra-input::placeholder { color: rgba(16,14,42,0.4); }

  /* ---- Footer nav ---- */
  .step-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 30px; gap: 12px; }
  .btn-back {
    background: transparent; border: 1.5px solid rgba(16,14,42,0.16); color: #100e2a;
    font-family: 'Manrope', sans-serif; font-size: 14.5px; font-weight: 700;
    padding: 12px 22px; border-radius: 999px; cursor: pointer; transition: all 0.18s ease;
  }
  .btn-back:hover { background: rgba(16,14,42,0.05); }
  .btn-back:disabled { opacity: 0; pointer-events: none; }
  .btn-next {
    position: relative; overflow: hidden; margin-left: auto;
    background: linear-gradient(95deg, #0e8f83, #2f8fd1); color: #fff; font-size: 15.5px; font-weight: 700;
    padding: 13px 28px; border-radius: 999px; border: none; cursor: pointer;
    font-family: 'Manrope', sans-serif; transition: transform 0.18s ease, box-shadow 0.18s ease;
    display: flex; align-items: center; gap: 8px;
  }
  .btn-next::after {
    content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-20deg); transition: left 0.6s ease; pointer-events: none;
  }
  .btn-next:hover:not(:disabled)::after { left: 140%; }
  .btn-next:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 26px -10px rgba(14,143,131,0.5); }
  .btn-next:disabled { opacity: 0.65; cursor: default; }

  /* ---- Review step ---- */
  .review-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .review-item { border-bottom: 1px solid rgba(16,14,42,0.07); padding-bottom: 10px; }
  .review-item .rl { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: rgba(16,14,42,0.45); margin-bottom: 3px; }
  .review-item .rv { font-size: 14.5px; font-weight: 600; }
  .review-item.full { grid-column: 1 / -1; }
  @media (max-width: 520px) { .review-grid { grid-template-columns: 1fr; } }

  .error {
    display: none; background: #fdece7; color: #b3401f; border-radius: 12px;
    padding: 12px 14px; font-size: 13.5px; margin-bottom: 18px; font-weight: 600;
  }

  /* ---- Dark mode ---- */
  html[data-theme="dark"] body { background: #0d0c1f; color: #f2f0f8; }
  html[data-theme="dark"] a { color: #7ee0d4; }
  html[data-theme="dark"] .topbar { background: rgba(13,12,31,0.85); border-bottom-color: rgba(255,255,255,0.1); }
  html[data-theme="dark"] .logo-text .ink { color: #f2f0f8; }
  html[data-theme="dark"] .navlink { color: #f2f0f8; }
  html[data-theme="dark"] .theme-toggle { background: #18162e; border-color: rgba(255,255,255,0.14); }
  html[data-theme="dark"] .progress-track { background: rgba(255,255,255,0.1); }
  html[data-theme="dark"] .progress-step-label { color: #a9a6bd; }
  html[data-theme="dark"] .card { background: #18162e; border-color: rgba(255,255,255,0.1); }
  html[data-theme="dark"] .step-hint { color: #a9a6bd; }
  html[data-theme="dark"] .field-input { background: #100e2a; color: #f2f0f8; border-color: rgba(255,255,255,0.14); }
  html[data-theme="dark"] .field-label { color: #8f8ba3; }
  html[data-theme="dark"] .sec-label { color: #8f8ba3; }
  html[data-theme="dark"] .pill { background: #100e2a; color: #f2f0f8; border-color: rgba(255,255,255,0.16); }
  html[data-theme="dark"] .pill.sel { background: #7ee0d4; border-color: #7ee0d4; color: #0d0c1f; }
  html[data-theme="dark"] .chip { background: #100e2a; color: #f2f0f8; border-color: rgba(255,255,255,0.16); }
  html[data-theme="dark"] .chip.sel { background: rgba(126,224,212,0.16); border-color: #7ee0d4; color: #7ee0d4; }
  html[data-theme="dark"] .chip.none-chip.sel { background: #7ee0d4; border-color: #7ee0d4; color: #0d0c1f; }
  html[data-theme="dark"] .extra-input { color: #f2f0f8; border-color: rgba(255,255,255,0.2); }
  html[data-theme="dark"] .btn-back { color: #f2f0f8; border-color: rgba(255,255,255,0.18); }
  html[data-theme="dark"] .btn-back:hover { background: rgba(255,255,255,0.06); }
  html[data-theme="dark"] .review-item { border-bottom-color: rgba(255,255,255,0.08); }
  html[data-theme="dark"] .review-item .rl { color: #8f8ba3; }
  html[data-theme="dark"] .error { background: rgba(210,79,40,0.16); color: #f0a488; }

  /* ---- Fun + smart additions ---- */
  .step-dots { display: flex; justify-content: space-between; margin-top: 12px; }
  .sdot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; background: rgba(16,14,42,0.06); color: rgba(16,14,42,0.45); transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  .sdot.done { background: #0e8f83; color: #fff; font-weight: 800; font-size: 12px; }
  .sdot.now { background: #fff; box-shadow: 0 0 0 2px #0e8f83, 0 8px 18px -8px rgba(14,143,131,0.6); transform: scale(1.18); color: #100e2a; }
  .cura-bubble { position: relative; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding: 10px 16px 10px 10px; border-radius: 18px 18px 18px 4px; background: linear-gradient(120deg, rgba(14,143,131,0.1), rgba(124,111,219,0.09)); border: 1px solid rgba(14,143,131,0.2); font-size: 13.5px; font-weight: 600; width: fit-content; max-width: 100%; animation: bubblePop 0.45s cubic-bezier(0.34,1.56,0.64,1) both; }
  @keyframes bubblePop { from { opacity: 0; transform: translateY(8px) scale(0.96); } to { opacity: 1; transform: none; } }
  .cura-face { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #0e8f83, #7c6fdb); display: flex; align-items: center; justify-content: center; font-size: 15px; flex: 0 0 auto; animation: curaBob 3.6s ease-in-out infinite; }
  @keyframes curaBob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3px) rotate(-6deg); } }
  .smart-hint { margin: -10px 0 20px; padding: 11px 14px; border-radius: 12px; background: rgba(47,143,209,0.09); border: 1px solid rgba(47,143,209,0.22); color: #1e5f8a; font-size: 13px; line-height: 1.5; font-weight: 600; animation: bubblePop 0.35s ease both; }
  .strength-tip { margin-top: 18px; padding: 12px 14px; border-radius: 12px; background: rgba(201,138,16,0.1); color: #8a5f0a; font-size: 13px; line-height: 1.5; }
  .strength-tip.good { background: rgba(14,143,131,0.1); color: #0b6f66; font-weight: 700; }
  .pill { transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), background 0.18s ease, border-color 0.18s ease, color 0.18s ease; }
  .pill.sel { transform: scale(1.06); }
  .chip.sel { animation: chipPop 0.25s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes chipPop { from { transform: scale(0.88); } to { transform: scale(1); } }
  .confetti-piece { position: fixed; top: -12px; width: 9px; height: 9px; border-radius: 2px; pointer-events: none; z-index: 999; animation: confettiFall 1.4s ease-in forwards; }
  @keyframes confettiFall { to { transform: translateY(100vh) rotate(540deg); opacity: 0; } }
  @media (max-width: 520px) { .card { padding: 28px 20px; } .sdot { width: 26px; height: 26px; font-size: 11px; } }
  @media (prefers-reduced-motion: reduce) { .cura-face, .cura-bubble, .chip.sel, .confetti-piece { animation: none; } }
  html[data-theme="dark"] .sdot { background: rgba(255,255,255,0.08); color: #a9a6bd; }
  html[data-theme="dark"] .sdot.now { background: #18162e; color: #f2f0f8; box-shadow: 0 0 0 2px #7ee0d4; }
  html[data-theme="dark"] .sdot.done { background: #7ee0d4; color: #0d0c1f; }
  html[data-theme="dark"] .cura-bubble { background: linear-gradient(120deg, rgba(126,224,212,0.1), rgba(124,111,219,0.12)); border-color: rgba(126,224,212,0.25); }
  html[data-theme="dark"] .smart-hint { background: rgba(47,143,209,0.14); border-color: rgba(47,143,209,0.3); color: #a9d4f0; }
  html[data-theme="dark"] .strength-tip { background: rgba(240,180,60,0.12); color: #f0c060; }
  html[data-theme="dark"] .strength-tip.good { background: rgba(126,224,212,0.12); color: #7ee0d4; }
</style>
</head>
<body>
  <div class="topbar">
    <a class="logo-wrap" href="../">
      <img src="../assets/d4f7acc01b9438e998c9e7b9676584b0.png" alt="QueroCura">
      <span class="logo-text"><span class="ink">Quero</span><span class="teal">Cura</span></span>
    </a>
    <div class="topbar-right">
      <a class="navlink" href="#" id="qc-skip-link" onclick="qcSkip(event)">Skip for now</a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" id="theme-toggle-btn">
        <span id="theme-toggle-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke="#100e2a" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
      </button>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-top">
      <span class="progress-step-label" id="qc-progress-label">Step 1 of 6</span>
      <span class="progress-step-label"><span id="qc-strength-label">Profile strength</span> <b id="qc-progress-pct">0%</b></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="qc-progress-fill" style="width:0%"></div></div>
    <div class="step-dots" id="qc-step-dots" aria-hidden="true"></div>
  </div>

  <div class="wrap">
    <div class="card" id="qc-card">
      <div class="step-glow" id="qc-step-glow"></div>
      <div class="error" id="qc-error" role="alert"></div>
      <div id="qc-step-body"></div>
      <div class="finish-flourish" id="qc-finish-flourish">
        <div class="finish-check">✓</div>
        <h2 id="qc-finish-title">You're all set!</h2>
        <p>Taking you to your dashboard…</p>
      </div>
    </div>
  </div>

<script src="../assets/qc-profile.js"></script>
<script>
/* ---- Theme toggle (shared qc-theme key) ---- */
var STORAGE_KEY = 'qc-theme';
var root = document.documentElement;
var SUN_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="#f2f0f8" stroke-width="1.7"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5M18.4 18.4l-1.5-1.5M7.1 7.1L5.6 5.6" stroke="#f2f0f8" stroke-width="1.7" stroke-linecap="round"/></svg>';
var MOON_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke="#100e2a" stroke-width="1.7" stroke-linejoin="round"/></svg>';
function applyTheme(dark) {
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
  try { localStorage.setItem(STORAGE_KEY, dark ? 'dark' : 'light'); } catch (e) {}
  var icon = document.getElementById('theme-toggle-icon');
  if (icon) icon.innerHTML = dark ? SUN_ICON : MOON_ICON;
}
window.toggleTheme = function () { applyTheme(root.getAttribute('data-theme') !== 'dark'); };
if (root.getAttribute('data-theme') === 'dark') applyTheme(true);

/* ---- Setup ---- */
const API = "https://app.querocura.com/api";
const TOTAL_STEPS = 6;
let curStep = 1;
let options = null;
let state = {
  display_name: "", age: "", sex: "unknown", blood_type: "unknown",
  med_allergies: [], food_allergies: [], env_allergies: [],
  conditions: [], past_conditions: [], medications: "", family_history: [],
  smoking: "unknown", alcohol: "unknown", exercise: "unknown",
  pregnant: false, occupation: "",
};

const STEP_META = [
  { tint: "#e6f6f4", icon: "👋", title: "Let's get acquainted", hint: "A few basics so QueroCura knows who it's caring for.", say: "Hi, I'm Cura! I'll keep this quick — about a minute." },
  { tint: "#fdece7", icon: "⚠️", title: "Any allergies?", hint: "We use this to keep every recommendation safer.", say: "Allergies first — this is what keeps advice safe for you." },
  { tint: "#eae8fb", icon: "📋", title: "Your health history", hint: "What you live with now, and what's already behind you.", say: "Both matter: ongoing conditions and the ones you've left behind." },
  { tint: "#fbf1dc", icon: "💊", title: "Medicines & family health", hint: "Current medicines and hereditary patterns that matter.", say: "Family patterns often explain more than you'd think." },
  { tint: "#e4f1fb", icon: "🏃", title: "How do you live?", hint: "Lifestyle shapes risk and the advice you receive.", say: "No judgement here — honest answers give better advice." },
  { tint: "#e6f6f4", icon: "✨", title: "Review & finish", hint: "One last check, then you're all set.", say: "Last stop! Check it over and we're done." },
];
const SEEN_FLAG = { 2: "_allergiesSeen", 3: "_conditionsSeen", 4: "_medsSeen" };

const esc = QCProfile.esc;
function firstName() { return (state.display_name || "").trim().split(/\s+/)[0] || ""; }

function mergeProfileIntoState(p) {
  if (!p) return;
  ["display_name","sex","blood_type","medications","smoking","alcohol","exercise","occupation"].forEach(k => {
    if (p[k] !== undefined && p[k] !== null) state[k] = p[k];
  });
  if (p.age !== undefined && p.age !== null) state.age = p.age;
  ["med_allergies","food_allergies","env_allergies","conditions","past_conditions","family_history"].forEach(k => {
    if (Array.isArray(p[k])) state[k] = p[k].slice();
  });
  if (typeof p.pregnant === "boolean") state.pregnant = p.pregnant;
}

function payloadFor(finish) {
  const out = {};
  Object.keys(state).forEach(k => { if (k.charAt(0) !== "_") out[k] = state[k]; });
  out.wizard_done = !!finish;
  return out;
}
async function saveProfile(finish) {
  QCProfile.flush(document.getElementById("qc-step-body"));
  QCProfile.applyRules(state);
  const res = await fetch(API + "/profile", {
    method: "POST", credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payloadFor(finish)),
  });
  const data = await res.json();
  if (!res.ok || !data.ok) throw new Error(data.message || "Couldn't save your profile.");
  return data;
}

window.qcSkip = async function (e) {
  e.preventDefault();
  try { await saveProfile(true); window.location.href = "../dashboard/"; }
  catch (err) { showError(err.message); }
};

function showError(msg) {
  const box = document.getElementById("qc-error");
  box.textContent = msg || "Something went wrong. Please try again.";
  box.style.display = "block";
}
function hideError() { document.getElementById("qc-error").style.display = "none"; }

/* ---- progress: step dots + a live "profile strength" meter ---- */
function updateProgress() {
  const s = QCProfile.strength(state);
  document.getElementById("qc-progress-label").textContent = "Step " + curStep + " of " + TOTAL_STEPS;
  document.getElementById("qc-progress-pct").textContent = s.pct + "%";
  document.getElementById("qc-progress-fill").style.width = Math.max(4, s.pct) + "%";
  document.getElementById("qc-step-dots").innerHTML = STEP_META.map((m, i) =>
    '<span class="sdot' + (i + 1 === curStep ? ' now' : i + 1 < curStep ? ' done' : '') + '">' + (i + 1 < curStep ? "✓" : m.icon) + '</span>').join("");
  document.getElementById("qc-step-glow").style.setProperty("--step-tint", STEP_META[curStep - 1].tint);
}

/* ---- Cura's speech bubble: reacts to what you've entered ---- */
function curaSays() {
  const n = firstName(), age = parseInt(state.age, 10);
  if (curStep === 1 && n) return "Nice to meet you, " + n + "! 😊";
  if (curStep === 2) {
    const a = state.med_allergies.length + state.food_allergies.length + state.env_allergies.length;
    if (a) return "Got it — I'll keep " + a + " allerg" + (a > 1 ? "ies" : "y") + " in mind on every check. 🛡️";
  }
  if (curStep === 3) {
    if (state.conditions.length && state.past_conditions.length) return "Thanks — that's a really complete picture. 🧩";
    if (state.conditions.length) return "Noted. I'll watch the trends that matter for " + state.conditions[0].toLowerCase() + ". 👀";
  }
  if (curStep === 4 && !isNaN(age) && age >= 40) return "From 40 on, heart and diabetes history in the family really count. ❤️";
  if (curStep === 5 && state.exercise === "active") return "Active already — love it! 💪";
  return STEP_META[curStep - 1].say;
}
function refreshBubble() { const b = document.getElementById("qc-bubble"); if (b) b.textContent = curaSays(); }

/* ---- Smart hints: only shown when they apply ---- */
function smartHint() {
  const age = parseInt(state.age, 10);
  if (curStep === 1 && !isNaN(age) && (age < 1 || age > 120)) return "That age doesn't look right — double-check it?";
  if (curStep === 1 && !isNaN(age) && age < 18) return "Under 18? Symptom checks use child-specific guidance for you. 🧒";
  if (curStep === 3) {
    const cs = state.conditions.map(c => c.toLowerCase());
    if (cs.some(c => c.indexOf("diabetes") >= 0)) return "With diabetes, logging glucose in Vitals lets QueroCura spot trends early. 🩸";
    if (cs.some(c => c.indexOf("hypertension") >= 0)) return "With hypertension, regular BP readings in Vitals make your trends far more useful. ❤️";
  }
  if (curStep === 5 && state.smoking === "regular") return "Thank you for being honest. It nudges your health score — and quitting moves it back up. 🌱";
  return "";
}

function buildStepBody() {
  const meta = STEP_META[curStep - 1];
  const hint = smartHint();
  let inner =
    '<div class="cura-bubble"><span class="cura-face" aria-hidden="true">🩺</span><span id="qc-bubble">' + esc(curaSays()) + '</span></div>' +
    '<div class="step-head"><div class="step-icon" style="background:' + meta.tint + '">' + meta.icon + '</div><h1 class="step-title">' + meta.title + '</h1></div>' +
    '<p class="step-hint">' + meta.hint + '</p>' +
    (hint ? '<div class="smart-hint">💡 ' + esc(hint) + '</div>' : '');

  if (curStep === 1) {
    inner += floatField("f-name", "display_name", "What should we call you?", "text");
    inner += floatField("f-age", "age", "Age", "number", { min: 1, max: 120, optional: true });
    inner += QCProfile.sexPicker();
    inner += QCProfile.bloodGroup(options);
  } else if (curStep === 2) {
    inner += '<div class="sec-label">Medication allergies</div>' + QCProfile.chipCloud("med_allergies", options.common_med_allergies, "Another medication allergy — press Enter or tap Add", { noun: "medications" });
    inner += '<div class="sec-label">Food allergies</div>' + QCProfile.chipCloud("food_allergies", options.common_food_allergies, "Another food allergy — press Enter or tap Add");
    inner += '<div class="sec-label">Environmental allergies</div>' + QCProfile.chipCloud("env_allergies", options.common_env_allergies, "Another environmental allergy — press Enter or tap Add");
  } else if (curStep === 3) {
    inner += '<div class="sec-label">Ongoing conditions <span class="field-opt">you live with these now</span></div>' +
      QCProfile.chipCloud("conditions", options.known_conditions, "Another ongoing condition — press Enter or tap Add", { noun: "conditions" });
    inner += '<div class="sec-label">Past conditions &amp; surgeries <span class="field-opt">resolved, treated or removed</span></div>' +
      QCProfile.chipCloud("past_conditions", options.past_conditions, "Another past condition or surgery — press Enter or tap Add", { noun: "past conditions" });
  } else if (curStep === 4) {
    inner += floatField("f-meds", "medications", "Current medications", "textarea", { rows: 3, optional: true });
    inner += '<div class="sec-label">Family history</div>' + QCProfile.chipCloud("family_history", options.known_family_history, "Another family condition — press Enter or tap Add");
  } else if (curStep === 5) {
    inner += QCProfile.lifestyle("smoking", "Smoking") + QCProfile.lifestyle("alcohol", "Alcohol") + QCProfile.lifestyle("exercise", "Exercise");
  } else if (curStep === 6) {
    const preg = QCProfile.pregnancyBlock();
    inner += preg || (state.sex === "male" ? '<div class="qcp-help">Pregnancy questions are skipped — they don\'t apply to you.</div>' : '');
    inner += floatField("f-occ", "occupation", "Occupation", "text", { optional: true });
    inner += '<div class="sec-label" style="margin-top:26px">Review</div>' + renderReview();
    const s = QCProfile.strength(state);
    if (s.missing.length) inner += '<div class="strength-tip">Profile ' + s.pct + '% complete. Adding <b>' + esc(s.missing.slice(0, 2).join(" and ")) + '</b> would sharpen your health score and symptom checks.</div>';
    else inner += '<div class="strength-tip good">Profile complete — nice work! 🎉</div>';
  }

  inner += '<div class="step-footer">' +
    '<button class="btn-back" id="qc-back-btn" onclick="qcBack()"' + (curStep === 1 ? ' disabled' : '') + '>&larr; Back</button>' +
    '<button class="btn-next" id="qc-next-btn" onclick="qcNext()">' +
      (curStep === TOTAL_STEPS ? 'Finish &amp; go to dashboard ✨' : 'Continue') +
      (curStep === TOTAL_STEPS ? '' : ' <span>&rarr;</span>') +
    '</button>' +
  '</div>';
  return inner;
}

/* Re-render the current step without losing scroll position or what the person was typing. */
function renderStep(opts) {
  opts = opts || {};
  const body = document.getElementById("qc-step-body");
  const y = window.scrollY;
  // keep unsaved text in the plain text fields (name, age, meds, occupation) -- already in `state` via oninput
  body.innerHTML = buildStepBody();
  updateProgress();
  window.scrollTo(0, y);
  if (opts.keepFocusCat) {
    const inp = body.querySelector('input.extra-input[data-cat="' + opts.keepFocusCat + '"]');
    if (inp) inp.focus();
  }
}

QCProfile.bind(state, function (notes, opts) {
  if (notes && notes.length) { /* rules already applied; surface what changed */ }
  renderStep(opts);
}, function () { refreshBubble(); });

function floatField(id, cat, label, type, opt) {
  opt = opt || {};
  const val = state[cat] == null ? "" : state[cat];
  const filled = val !== "" ? " filled" : "";
  const openTag = type === "textarea"
    ? '<textarea class="field-input' + filled + '" id="' + id + '" rows="' + (opt.rows || 3) + '" placeholder=" " oninput="qcSetText(this,\'' + cat + '\')">' + esc(val) + '</textarea>'
    : '<input class="field-input' + filled + '" id="' + id + '" type="' + (type || "text") + '" placeholder=" " value="' + esc(val) + '" ' +
        (opt.min !== undefined ? 'min="' + opt.min + '" ' : '') + (opt.max !== undefined ? 'max="' + opt.max + '" ' : '') +
        'oninput="qcSetText(this,\'' + cat + '\')" onkeydown="if(event.key===\'Enter\'){event.preventDefault();qcNext();}">';
  return '<div class="field"><div class="field-inner">' + openTag +
    '<label class="field-label" for="' + id + '">' + esc(label) + (opt.optional ? ' <span class="field-opt">optional</span>' : '') + '</label>' +
    '</div></div>';
}
window.qcSetText = function (el, cat) {
  el.classList.toggle('filled', el.value.length > 0);
  state[cat] = el.value;
  if (cat === "age") {
    // age can change whether pregnancy applies; re-check without re-rendering mid-typing
    QCProfile.applyRules(state);
  }
  refreshBubble();
  updateProgress();
};

function renderReview() {
  const sexLabel = (QCProfile.SEX_UI[state.sex] || { label: state.sex }).label;
  const rows = [
    ["Name", state.display_name || "—"],
    ["Age", state.age || "—"],
    ["Biological sex", sexLabel],
    ["Blood group", state.blood_type === "unknown" ? "Not sure" : state.blood_type],
    ["Allergies", [].concat(state.med_allergies, state.food_allergies, state.env_allergies).join(", ") || "None recorded"],
    ["Ongoing conditions", state.conditions.join(", ") || "None recorded"],
    ["Past conditions", state.past_conditions.join(", ") || "None recorded"],
    ["Medications", state.medications || "—"],
    ["Family history", state.family_history.join(", ") || "None recorded"],
    ["Smoking", state.smoking], ["Alcohol", state.alcohol], ["Exercise", state.exercise],
    ["Occupation", state.occupation || "—"],
  ];
  if (QCProfile.pregnancyApplicable(state)) rows.splice(4, 0, ["Pregnant", state.pregnant ? "Yes" : "No"]);
  return '<div class="review-grid">' + rows.map(([l, v]) =>
    '<div class="review-item"><div class="rl">' + esc(l) + '</div><div class="rv">' + esc(v) + '</div></div>'
  ).join("") + '</div>';
}

window.qcBack = function () {
  if (curStep <= 1) return;
  QCProfile.flush(document.getElementById("qc-step-body"));
  curStep -= 1;
  const card = document.getElementById("qc-card");
  card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
  renderStep(); window.scrollTo({ top: 0, behavior: "smooth" });
};

function burst() {
  const colors = ["#0e8f83", "#7c6fdb", "#2f8fd1", "#e0a52c", "#f0765a"];
  for (let i = 0; i < 40; i++) {
    const p = document.createElement("div");
    p.className = "confetti-piece";
    p.style.left = (30 + Math.random() * 40) + "vw";
    p.style.background = colors[i % colors.length];
    p.style.animationDelay = (Math.random() * 0.25) + "s";
    p.style.animationDuration = (1.1 + Math.random() * 0.8) + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 2400);
  }
}

window.qcNext = async function () {
  hideError();
  const btn = document.getElementById("qc-next-btn");
  if (!btn || btn.disabled) return;
  // basic sanity before moving on
  const age = parseInt(state.age, 10);
  if (curStep === 1 && state.age !== "" && (isNaN(age) || age < 1 || age > 120)) {
    showError("Please enter an age between 1 and 120 — or leave it blank.");
    return;
  }
  btn.disabled = true;
  if (SEEN_FLAG[curStep]) state[SEEN_FLAG[curStep]] = true;
  if (curStep === 3) state._pastSeen = true;
  if (curStep === 4) state._familySeen = true;
  try {
    await saveProfile(curStep === TOTAL_STEPS);
  } catch (err) {
    btn.disabled = false;
    showError(err.message);
    return;
  }
  if (curStep === TOTAL_STEPS) {
    document.getElementById("qc-finish-title").textContent = firstName() ? "You're all set, " + firstName() + "!" : "You're all set!";
    document.getElementById("qc-finish-flourish").classList.add("show");
    burst();
    setTimeout(() => { window.location.href = "../dashboard/"; }, 1400);
    return;
  }
  curStep += 1;
  const card = document.getElementById("qc-card");
  card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
  renderStep(); window.scrollTo({ top: 0, behavior: "smooth" });
};

(async function init() {
  const [meData, profData, optData] = await Promise.all([
    fetch(API + "/auth/me", { credentials: "include" }).then(r => r.json()).catch(() => ({ logged_in: false })),
    fetch(API + "/profile", { credentials: "include" }).then(r => r.json()).catch(() => null),
    fetch(API + "/profile/options", { credentials: "include" }).then(r => r.json()).catch(() => null),
  ]);

  if (!meData.logged_in) { window.location.href = "../login/"; return; }

  options = QCProfile.options(optData && optData.options);

  if (profData && profData.ok && profData.profile) {
    if (profData.profile.wizard_done) { window.location.href = "../dashboard/"; return; }
    mergeProfileIntoState(profData.profile);
  }
  if (!state.display_name && meData.user) state.display_name = meData.user.display_name || "";

  renderStep();
})();
</script>
</body>
</html>
