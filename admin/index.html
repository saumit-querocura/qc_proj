<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://app.querocura.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>QueroCura admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/x-icon" href="../icons/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/qc-base.css?v=7b9ea421">
<style>
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }
  .org { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; margin-bottom: 12px; }
  .org h3 { margin: 0 0 4px; font-size: 17px; } .org small { display: block; color: var(--muted); font-weight: 600; margin-top: 3px; }
  .pill { display: inline-block; padding: 3px 11px; border-radius: 999px; font: 800 11px 'Manrope', sans-serif; text-transform: uppercase; background: rgba(127,127,160,.18); }
  .pill.pending { background: rgba(201,138,16,.18); color: var(--warn); } .pill.active { background: rgba(47,143,94,.16); color: var(--good); } .pill.rejected, .pill.suspended { background: rgba(210,79,40,.15); color: var(--danger); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
  .tabs button { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font: 800 12.5px 'Manrope', sans-serif; cursor: pointer; color: var(--muted); } .tabs button.on { background: var(--ink); color: var(--sand); border-color: var(--ink); }
  [hidden] { display: none !important; }
</style>
<script src="../assets/qc-csp.js?v=77f89cc2"></script>
</head>
<body>
  <div class="topbar"><a class="logo-wrap" href="../"><img src="../assets/d4f7acc01b9438e998c9e7b9676584b0.png" alt="QueroCura"><span class="logo-text"><span class="ink">Quero</span><span class="teal">Cura</span> admin</span></a></div>
  <main class="wrap">
    <form id="key-form" class="card" novalidate>
      <h2>Admin key</h2>
      <p class="sub">Kept in this tab's memory only. It is never saved, and closing or reloading the tab forgets it.</p>
      <div class="field"><label for="key">CURAVAULT_ADMIN_KEY</label><input class="input" id="key" type="password" autocomplete="off"></div>
      <button class="btn btn-primary" type="submit">Unlock</button>
      <div class="msg" id="key-msg" role="status"></div>
    </form>
    <section id="panel" hidden>
      <div class="card" id="sec-card"><h2>Security overview</h2><div id="sec-body" class="hint">Loading…</div></div>
      <div class="row" style="justify-content:space-between"><h1 class="page-title" style="margin:0">Hospital applications</h1><button class="btn btn-sm" id="verify" type="button">Verify audit log</button></div>
      <div class="msg" id="verify-msg" role="status"></div>
      <div class="tabs" id="tabs"></div>
      <div id="list"></div>
    </section>
  </main>
  <script src="../assets/qc-page.js?v=c34c97a9"></script>
  <script src="../assets/js/admin.js?v=17b1a26b"></script>
</body>
</html>
